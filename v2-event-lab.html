<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0907">
  <title>네크로멘서 앤드 다이스 · Event Lab</title>
  <link rel="stylesheet" href="v2-event-lab.css?v=20261005-event-lab-poster-shell-1">
</head>
<body>
  <main class="event-lab">
    <header class="lab-header">
      <div>
        <strong>EVENT LAB</strong>
        <span>벽보형 사건 테스트</span>
      </div>
      <nav>
        <a href="index.html">시작 화면</a>
        <a href="v2-map-practice.html">맵</a>
      </nav>
    </header>

    <section class="poster-workspace" aria-label="벽보형 사건 테스트 무대">
      <div class="poster-backdrop" aria-hidden="true"></div>

      <article class="event-poster is-empty" aria-labelledby="posterTitle">
        <span class="poster-pin poster-pin-left" aria-hidden="true"></span>
        <span class="poster-pin poster-pin-right" aria-hidden="true"></span>
        <span class="poster-stamp" aria-hidden="true">사건</span>

        <div class="poster-art" aria-hidden="true">
          <div class="poster-art-vignette"></div>
          <div class="poster-art-placeholder">
            <span>ILLUSTRATION</span>
            <small>새 사건 이미지 영역</small>
          </div>
        </div>

        <div class="poster-copy">
          <p class="poster-location">장소 미정</p>
          <h1 id="posterTitle">새 사건</h1>
          <p id="posterText">사건 내용이 여기에 표시됩니다.</p>
        </div>

        <div class="poster-choices" aria-label="선택지 미리보기">
          <button type="button" disabled>선택지 1</button>
          <button type="button" disabled>선택지 2</button>
        </div>

        <footer class="poster-footer">
          <span>등록된 테스트 이벤트 <b id="eventCount">0</b></span>
          <span>새 사건 제작 준비 완료</span>
        </footer>
      </article>
    </section>
  </main>

  <script src="v2-event-lab-data.js?v=20261005-event-lab-poster-shell-1"></script>
  <script src="v2-event-lab.js?v=20261005-event-lab-poster-shell-1"></script>
</body>
</html>

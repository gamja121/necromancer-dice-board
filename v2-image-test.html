<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b10">
  <title>네크로멘서 이미지 테스트</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0b10;
      color: #f2edf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(77, 48, 96, .28), transparent 34rem),
        #0d0b10;
    }
    .image-test {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .image-test-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .image-test-header h1 {
      margin: 4px 0 0;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
    }
    .image-test-header span {
      color: #bca8cb;
      font-size: .8rem;
      letter-spacing: .14em;
    }
    .image-test-home {
      color: #f2edf7;
      text-decoration: none;
      border: 1px solid #51465b;
      border-radius: 10px;
      padding: 9px 12px;
      background: #17121b;
    }
    .image-test-note {
      margin: 0 0 18px;
      color: #c9bdcf;
      line-height: 1.55;
    }
    .image-test-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .image-test-toolbar button {
      border: 1px solid #51465b;
      border-radius: 999px;
      padding: 8px 13px;
      background: #17121b;
      color: #e7ddeb;
    }
    .image-test-toolbar button.is-active {
      border-color: #9c79b1;
      background: #37263f;
    }
    .image-test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }
    .image-pair {
      border: 1px solid #3c3344;
      border-radius: 14px;
      padding: 12px;
      background: rgba(20, 16, 24, .86);
    }
    .image-pair h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #eadff0;
    }
    .image-pair-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .image-pair:not(.has-unified) .image-pair-row {
      grid-template-columns: 1fr 1fr;
    }
    .unified-card-stage {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .unified-card-stage img {
      display: block;
    }
    .svg-card-text {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .svg-card-text text {
      fill: #0a160f;
      font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke fill;
      stroke: rgba(255,255,255,.08);
      stroke-width: .25px;
    }
    .unified-card-stage .overlay-panel {
      position: absolute;
      left: 25%;
      width: 50%;
      display: grid;
      place-items: center;
      background: rgba(171, 205, 170, .96);
      color: #08150d;
      font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
    .unified-card-stage .overlay-title {
      top: 5.5%;
      height: 12.5%;
      font-size: clamp(7px, 1.25vw, 11px);
      border-radius: 2px;
    }
    .unified-card-stage .overlay-desc {
      left: 24%;
      width: 53%;
      bottom: 9%;
      height: 18%;
      font-size: clamp(5px, .9vw, 8px);
      letter-spacing: -.04em;
      border-radius: 2px;
    }
    .image-card {
      min-width: 0;
    }
    .image-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: .75rem;
      color: #bca8cb;
      letter-spacing: .06em;
    }
    .image-preview {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 190px;
      padding: 8px;
      overflow: hidden;
      border: 1px solid #4e4356;
      border-radius: 10px;
      background-color: #ddd;
      background-image:
        linear-gradient(45deg, #bdbdbd 25%, transparent 25%),
        linear-gradient(-45deg, #bdbdbd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #bdbdbd 75%),
        linear-gradient(-45deg, transparent 75%, #bdbdbd 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .image-preview img {
      display: block;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
    }
    .image-file {
      display: block;
      margin-top: 7px;
      color: #9f94a5;
      font-size: .67rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .image-size {
      display: block;
      margin-top: 4px;
      color: #c9bdcf;
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
    }
    .image-preview {
      cursor: zoom-in;
    }
    .image-modal[hidden] { display: none; }
    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, .82);
    }
    .image-modal-panel {
      position: relative;
      width: min(960px, 96vw);
      max-height: 92vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      padding: 14px;
      border: 1px solid #5b4d66;
      border-radius: 14px;
      background: #151119;
      box-shadow: 0 20px 60px #000c;
    }
    .image-modal-close {
      justify-self: end;
      width: 42px;
      height: 42px;
      border: 1px solid #665770;
      border-radius: 9px;
      background: #211926;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .image-modal-preview {
      min-height: 260px;
      display: grid;
      place-items: center;
      overflow: auto;
      border: 1px solid #4e4356;
      border-radius: 10px;
      padding: 12px;
      background-color: #ddd;
      background-image:
        linear-gradient(45deg, #bdbdbd 25%, transparent 25%),
        linear-gradient(-45deg, #bdbdbd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #bdbdbd 75%),
        linear-gradient(-45deg, transparent 75%, #bdbdbd 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .image-modal-preview img {
      display: block;
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
    }
    .image-modal-preview .modal-stage-host {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 260px;
    }
    .image-modal-preview .modal-stage-host .unified-card-stage {
      width: min(480px, 82vw);
      max-width: 100%;
    }
    .image-modal-preview .modal-stage-host .unified-card-stage img {
      width: 100%;
      max-width: none;
      max-height: none;
      height: auto;
    }
    .image-modal-name {
      color: #d7c9de;
      font-size: .8rem;
      overflow-wrap: anywhere;
      text-align: center;
    }
    @media (max-width: 520px) {
      .image-test {
        padding-inline: 10px;
      }
      .image-test-grid {
        grid-template-columns: 1fr;
      }
      .image-preview {
        min-height: 170px;
      }
      .image-pair.has-unified .image-pair-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="image-test">
    <header class="image-test-header">
      <div>
        <span>V2 IMAGE LAB</span>
        <h1>이미지 테스트</h1>
      </div>
      <a class="image-test-home" href="index.html">⌂ 시작 화면</a>
    </header>

    <p class="image-test-note">
      게임 이미지의 잘림, 비율, 투명 배경을 한곳에서 확인하기 위한 검수 페이지입니다.
      체크무늬가 보이면 해당 영역은 투명 배경입니다.
    </p>

    <nav class="image-test-toolbar" aria-label="이미지 테스트 분류">
      <button class="is-active" type="button">주사위 컨트롤 카드</button>
      <button type="button" disabled>마물 카드</button>
      <button type="button" disabled>사건 초상화</button>
      <button type="button" disabled>UI</button>
    </nav>

    <section id="diceControlGrid" class="image-test-grid" aria-label="주사위 컨트롤 카드 목록"></section>
  </main>

  <section id="imageModal" class="image-modal" role="dialog" aria-modal="true" aria-label="이미지 확대 보기" hidden>
    <div class="image-modal-panel">
      <button id="imageModalClose" class="image-modal-close" type="button" aria-label="확대 보기 닫기">×</button>
      <div id="imageModalPreview" class="image-modal-preview">
        <img id="imageModalImage" alt="">
        <div id="imageModalStageHost" class="modal-stage-host" hidden></div>
      </div>
      <div id="imageModalName" class="image-modal-name"></div>
    </div>
  </section>

  <script>
    // Only list image files that currently exist in art/v2-style/ui/.
    // Each entry declares which language assets are present so the test page never shows
    // intentional "image load failed" placeholders for cards that have not been uploaded yet.
    const CARD_PAIRS = [
      { slug: "1", label: "눈금 1", langs: ["en", "ko"] },
      { slug: "2", label: "눈금 2", langs: ["en", "ko"] },
      { slug: "3", label: "눈금 3", langs: ["en", "ko"] },
      { slug: "4", label: "눈금 4", langs: ["en", "ko"] },
      { slug: "5", label: "눈금 5", langs: ["en", "ko"] },
      { slug: "6", label: "눈금 6", langs: ["ko"] },
      { slug: "echo", label: "효과 재발동 / Effect Reactivation", langs: ["en", "ko"] },
      { slug: "high", label: "큰수 / High", langs: ["en", "ko"] },
      { slug: "low", label: "작은수 / Low", langs: ["en", "ko"] },
      { slug: "odd", label: "홀수 / Odd", langs: ["en", "ko"] },
      { slug: "repeat", label: "반복 / Repeat", langs: ["en", "ko"] },
      { slug: "exclude-1", label: "제외 1 / Exclude 1", langs: ["en", "ko"] },
      { slug: "exclude-2", label: "제외 2 / Exclude 2", langs: ["en", "ko"] },
      { slug: "exclude-3", label: "제외 3 / Exclude 3", langs: ["en", "ko"] },
      { slug: "exclude-4", label: "제외 4 / Exclude 4", langs: ["en", "ko"] },
      { slug: "exclude-5", label: "제외 5 / Exclude 5", langs: ["en", "ko"] },
      { slug: "exclude-6", label: "제외 6 / Exclude 6", langs: ["en", "ko"] }
    ];

    const ROOT = "art/v2-style/ui/";
    const IMAGE_VERSION = "20260926-existing-only-1";
    const grid = document.getElementById("diceControlGrid");
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("imageModalImage");
    const modalStageHost = document.getElementById("imageModalStageHost");
    const modalName = document.getElementById("imageModalName");
    const modalClose = document.getElementById("imageModalClose");

    function openImageModal(path, alt) {
      modalStageHost.hidden = true;
      modalStageHost.replaceChildren();
      modalImage.hidden = false;
      modalImage.src = path;
      modalImage.alt = alt;
      modalName.textContent = path.split("/").pop();
      modal.hidden = false;
      modalClose.focus();
    }

    function openStageModal(stage, label) {
      modalImage.hidden = true;
      modalImage.removeAttribute("src");
      modalImage.alt = "";
      modalStageHost.hidden = false;
      modalStageHost.replaceChildren(stage.cloneNode(true));
      modalName.textContent = label;
      modal.hidden = false;
      modalClose.focus();
    }

    function closeImageModal() {
      modal.hidden = true;
      modalImage.hidden = false;
      modalImage.removeAttribute("src");
      modalImage.alt = "";
      modalStageHost.hidden = true;
      modalStageHost.replaceChildren();
      modalName.textContent = "";
    }

    modalClose.addEventListener("click", closeImageModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeImageModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !modal.hidden) closeImageModal();
    });

    for (const { slug, label, langs } of CARD_PAIRS) {
      const pair = document.createElement("article");
      pair.className = "image-pair";

      const title = document.createElement("h2");
      title.textContent = label;

      const row = document.createElement("div");
      row.className = "image-pair-row";

      for (const lang of langs) {
        const rawPath = lang === "ko"
          ? `${ROOT}dice-control-ko-${slug}.png`
          : `${ROOT}dice-control-${slug}.png`;
        const path = `${rawPath}?v=${IMAGE_VERSION}`;

        const card = document.createElement("div");
        card.className = "image-card";

        const langLabel = document.createElement("strong");
        langLabel.textContent = lang === "ko" ? "한글" : "영문";

        const preview = document.createElement("div");
        preview.className = "image-preview";

        const image = document.createElement("img");
        image.src = path;
        image.alt = `${label} ${lang === "ko" ? "한글" : "영문"} 카드`;
        image.loading = "lazy";

        const file = document.createElement("span");
        file.className = "image-file";
        file.textContent = rawPath.split("/").pop();

        const size = document.createElement("span");
        size.className = "image-size";
        size.textContent = "해상도 확인 중…";

        image.addEventListener("load", () => {
          size.textContent = `${image.naturalWidth} × ${image.naturalHeight}`;
        });
        image.addEventListener("error", () => {
          size.textContent = "이미지 로드 실패";
        });

        preview.append(image);
        preview.addEventListener("click", () => openImageModal(path, image.alt));
        card.append(langLabel, preview, file, size);
        row.append(card);
      }

      if (slug === "1") {
        pair.classList.add("has-unified");

        const card = document.createElement("div");
        card.className = "image-card";

        const langLabel = document.createElement("strong");
        langLabel.textContent = "SVG 통합 테스트";

        const preview = document.createElement("div");
        preview.className = "image-preview";

        const stage = document.createElement("div");
        stage.className = "unified-card-stage";

        const image = document.createElement("img");
        const rawPath = `${ROOT}dice-control-1-base.png`;
        const path = `${rawPath}?v=svg-base-1-20260926`;
        image.src = path;
        image.alt = "눈금 1 텍스트 없는 공용 카드 베이스";
        image.loading = "lazy";

        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("class", "svg-card-text");
        svg.setAttribute("viewBox", "0 0 192 168");
        svg.setAttribute("aria-hidden", "true");

        const titleText = document.createElementNS(svgNS, "text");
        titleText.setAttribute("x", "96");
        titleText.setAttribute("y", "19");
        titleText.setAttribute("font-size", "10");
        titleText.textContent = "주사위 컨트롤";

        const descText = document.createElementNS(svgNS, "text");
        descText.setAttribute("x", "96");
        descText.setAttribute("y", "139");
        descText.setAttribute("font-size", "7.2");
        descText.setAttribute("letter-spacing", "-0.35");
        descText.textContent = "주사위 눈금 1이 나온다";

        svg.append(titleText, descText);
        stage.append(image, svg);
        preview.append(stage);

        preview.addEventListener("click", () => {
          openStageModal(stage, "눈금 1 · SVG 통합 테스트");
        });

        const file = document.createElement("span");
        file.className = "image-file";
        file.textContent = "dice-control-1-base.png + SVG 텍스트";

        const size = document.createElement("span");
        size.className = "image-size";
        size.textContent = "공용 PNG 1장 + 벡터 언어 텍스트";

        card.append(langLabel, preview, file, size);
        row.append(card);
      }

      pair.append(title, row);
      grid.append(pair);
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b10">
  <title>네크로멘서 이미지 테스트</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0b10;
      color: #f2edf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(77, 48, 96, .28), transparent 34rem),
        #0d0b10;
    }
    .image-test {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .image-test-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .image-test-header h1 {
      margin: 4px 0 0;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
    }
    .image-test-header span {
      color: #bca8cb;
      font-size: .8rem;
      letter-spacing: .14em;
    }
    .image-test-home {
      color: #f2edf7;
      text-decoration: none;
      border: 1px solid #51465b;
      border-radius: 10px;
      padding: 9px 12px;
      background: #17121b;
    }
    .image-test-note {
      margin: 0 0 18px;
      color: #c9bdcf;
      line-height: 1.55;
    }
    .image-test-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .image-test-toolbar button {
      border: 1px solid #51465b;
      border-radius: 999px;
      padding: 8px 13px;
      background: #17121b;
      color: #e7ddeb;
    }
    .image-test-toolbar button.is-active {
      border-color: #9c79b1;
      background: #37263f;
    }
    .image-test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }
    .image-test-empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      border: 1px dashed #51465b;
      border-radius: 14px;
      color: #94899a;
      background: rgba(20, 16, 24, .78);
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <main class="image-test">
    <header class="image-test-header">
      <div>
        <span>V2 IMAGE LAB</span>
        <h1>이미지 테스트</h1>
      </div>
      <a class="image-test-home" href="index.html">⌂ 시작 화면</a>
    </header>

    <p class="image-test-note">
      게임 이미지의 잘림, 비율, 투명 배경을 한곳에서 확인하기 위한 검수 페이지입니다.
    </p>

    <nav class="image-test-toolbar" aria-label="이미지 테스트 분류">
      <button class="is-active" type="button">주사위 컨트롤 카드</button>
      <button type="button" disabled>마물 카드</button>
      <button type="button" disabled>사건 초상화</button>
      <button type="button" disabled>UI</button>
    </nav>

    <section class="image-test-grid" aria-label="이미지 목록">
      <div class="image-test-empty">
        다음 단계에서 주사위 컨트롤 카드 목록을 연결합니다.
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b10">
  <title>네크로멘서 이미지 테스트</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0b10;
      color: #f2edf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(77, 48, 96, .28), transparent 34rem),
        #0d0b10;
    }
    .image-test {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .image-test-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .image-test-header h1 {
      margin: 4px 0 0;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
    }
    .image-test-header span {
      color: #bca8cb;
      font-size: .8rem;
      letter-spacing: .14em;
    }
    .image-test-home {
      color: #f2edf7;
      text-decoration: none;
      border: 1px solid #51465b;
      border-radius: 10px;
      padding: 9px 12px;
      background: #17121b;
    }
    .image-test-note {
      margin: 0 0 18px;
      color: #c9bdcf;
      line-height: 1.55;
    }
    .image-test-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .image-test-toolbar button {
      border: 1px solid #51465b;
      border-radius: 999px;
      padding: 8px 13px;
      background: #17121b;
      color: #e7ddeb;
    }
    .image-test-toolbar button.is-active {
      border-color: #9c79b1;
      background: #37263f;
    }
    .image-test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }
    .image-pair {
      border: 1px solid #3c3344;
      border-radius: 14px;
      padding: 12px;
      background: rgba(20, 16, 24, .86);
    }
    .image-pair h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #eadff0;
    }
    .image-pair-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .image-card {
      min-width: 0;
    }
    .image-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: .75rem;
      color: #bca8cb;
      letter-spacing: .06em;
    }
    .image-preview {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 190px;
      padding: 8px;
      overflow: hidden;
      border: 1px solid #4e4356;
      border-radius: 10px;
      background-color: #ddd;
      background-image:
        linear-gradient(45deg, #bdbdbd 25%, transparent 25%),
        linear-gradient(-45deg, #bdbdbd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #bdbdbd 75%),
        linear-gradient(-45deg, transparent 75%, #bdbdbd 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .image-preview img {
      display: block;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
    }
    .image-file {
      display: block;
      margin-top: 7px;
      color: #9f94a5;
      font-size: .67rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    @media (max-width: 520px) {
      .image-test {
        padding-inline: 10px;
      }
      .image-test-grid {
        grid-template-columns: 1fr;
      }
      .image-preview {
        min-height: 170px;
      }
    }
  </style>
</head>
<body>
  <main class="image-test">
    <header class="image-test-header">
      <div>
        <span>V2 IMAGE LAB</span>
        <h1>이미지 테스트</h1>
      </div>
      <a class="image-test-home" href="index.html">⌂ 시작 화면</a>
    </header>

    <p class="image-test-note">
      게임 이미지의 잘림, 비율, 투명 배경을 한곳에서 확인하기 위한 검수 페이지입니다.
      체크무늬가 보이면 해당 영역은 투명 배경입니다.
    </p>

    <nav class="image-test-toolbar" aria-label="이미지 테스트 분류">
      <button class="is-active" type="button">주사위 컨트롤 카드</button>
      <button type="button" disabled>마물 카드</button>
      <button type="button" disabled>사건 초상화</button>
      <button type="button" disabled>UI</button>
    </nav>

    <section id="diceControlGrid" class="image-test-grid" aria-label="주사위 컨트롤 카드 목록"></section>
  </main>

  <script>
    const CARD_PAIRS = [
      ["echo", "Echo"],
      ["even", "Even"],
      ["high", "High"],
      ["low", "Low"],
      ["odd", "Odd"],
      ["repeat", "Repeat"],
      ["exclude-1", "Exclude 1"],
      ["exclude-2", "Exclude 2"],
      ["exclude-3", "Exclude 3"],
      ["exclude-4", "Exclude 4"],
      ["exclude-5", "Exclude 5"],
      ["exclude-6", "Exclude 6"]
    ];

    const ROOT = "art/v2-style/ui/";
    const grid = document.getElementById("diceControlGrid");

    for (const [slug, label] of CARD_PAIRS) {
      const pair = document.createElement("article");
      pair.className = "image-pair";

      const title = document.createElement("h2");
      title.textContent = label;

      const row = document.createElement("div");
      row.className = "image-pair-row";

      for (const lang of ["en", "ko"]) {
        const path = lang === "ko"
          ? `${ROOT}dice-control-ko-${slug}.png`
          : `${ROOT}dice-control-${slug}.png`;

        const card = document.createElement("div");
        card.className = "image-card";

        const langLabel = document.createElement("strong");
        langLabel.textContent = lang === "ko" ? "한글" : "영문";

        const preview = document.createElement("div");
        preview.className = "image-preview";

        const image = document.createElement("img");
        image.src = path;
        image.alt = `${label} ${lang === "ko" ? "한글" : "영문"} 카드`;
        image.loading = "lazy";

        const file = document.createElement("span");
        file.className = "image-file";
        file.textContent = path.split("/").pop();

        preview.append(image);
        card.append(langLabel, preview, file);
        row.append(card);
      }

      pair.append(title, row);
      grid.append(pair);
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160f0b">
  <title>전투 효과음 샘플</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans KR", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f5ead4; background: radial-gradient(circle at 50% 0, #4b3020, #17100c 55%, #090706); }
    main { width: min(760px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 18px max(34px, env(safe-area-inset-bottom)); }
    header { text-align: center; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; color: #f1c77d; font-size: clamp(25px, 7vw, 38px); }
    header p { margin: 0; color: #cdbda6; line-height: 1.55; font-size: 14px; }
    section { margin: 16px 0; padding: 17px; border: 1px solid #76583e; border-radius: 15px; background: rgba(27, 19, 14, .88); box-shadow: 0 12px 30px #0008, inset 0 0 25px #aa6d2511; }
    h2 { margin: 0 0 4px; color: #e7bd78; font-size: 21px; }
    .hint { margin: 0 0 14px; color: #9f8c76; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    button { min-height: 68px; padding: 11px; border: 1px solid #846444; border-radius: 11px; color: #f7ead5; background: linear-gradient(#553921, #2c1d14); box-shadow: inset 0 1px #d8a95d55, 0 4px 10px #0007; font: inherit; text-align: left; touch-action: manipulation; }
    button:active, button.is-playing { transform: translateY(2px); color: white; border-color: #efb95d; background: linear-gradient(#8a5627, #422616); box-shadow: 0 0 18px #ff9d3555; }
    button strong { display: block; color: #ffd58d; font-size: 17px; }
    button span { display: block; margin-top: 3px; color: #c9b9a3; font-size: 12px; }
    .pair { width: 100%; margin-top: 12px; text-align: center; background: linear-gradient(#7b2722, #3f1714); }
    .pair strong { font-size: 18px; }
    footer { margin-top: 20px; text-align: center; color: #ad9b84; font-size: 13px; line-height: 1.6; }
    @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>전투 효과음 샘플</h1>
      <p>버튼을 눌러 직접 비교하세요.<br>A~F는 기존 후보, G~L은 비금속·육체형 신규 후보입니다.</p>
    </header>

    <section>
      <h2>공격 모션</h2>
      <p class="hint">공격자가 앞으로 나갈 때 재생되는 소리</p>
      <div class="grid">
        <button data-file="attack.ogg" data-rate="1" data-synth="attack"><strong>A · 현재</strong><span>현재 전투에 적용된 합성 포함</span></button>
        <button data-file="claw.ogg" data-rate="1"><strong>B · 발톱</strong><span>거칠고 짧은 할퀴기</span></button>
        <button data-file="heavy.ogg" data-rate="1.14"><strong>C · 강타</strong><span>묵직한 무기 휘두르기</span></button>
        <button data-file="arrow.ogg" data-rate=".88"><strong>D · 질주</strong><span>빠르게 파고드는 바람 소리</span></button>
        <button data-file="magic.ogg" data-rate="1.2"><strong>E · 마력</strong><span>짧은 마력 방출</span></button>
        <button data-file="attack.ogg" data-rate=".72"><strong>F · 대형</strong><span>낮고 느린 대형 마물 공격</span></button>
        <button data-proc="blunt-swing"><strong>G · 둔기</strong><span>몽둥이를 크게 휘두르는 바람</span></button>
        <button data-proc="body-rush"><strong>H · 몸통</strong><span>육중한 몸이 밀고 들어오는 소리</span></button>
        <button data-proc="club-swing"><strong>I · 곤봉</strong><span>짧고 굵은 나무 곤봉 휘두르기</span></button>
        <button data-proc="bite-snap"><strong>J · 물기</strong><span>턱이 빠르게 닫히는 생물형 공격</span></button>
        <button data-proc="tail-sweep"><strong>K · 꼬리</strong><span>넓고 낮게 훑는 꼬리 휘두르기</span></button>
        <button data-proc="ground-smash"><strong>L · 내려찍기</strong><span>땅을 향해 무겁게 내리치는 공격</span></button>
      </div>
    </section>

    <section>
      <h2>피격 순간</h2>
      <p class="hint">피해 숫자가 나타나는 순간 재생되는 소리</p>
      <div class="grid">
        <button data-file="hit.ogg" data-rate="1" data-synth="hit"><strong>A · 현재</strong><span>현재 전투에 적용된 합성 포함</span></button>
        <button data-file="heavy.ogg" data-rate="1.45"><strong>B · 육중</strong><span>무게감 있는 둔탁한 충격</span></button>
        <button data-file="claw.ogg" data-rate=".76"><strong>C · 살점</strong><span>거친 생물형 피격</span></button>
        <button data-file="hit.ogg" data-rate="1.45"><strong>D · 경쾌</strong><span>짧고 선명한 타격 확인음</span></button>
        <button data-file="death.ogg" data-rate="1.55"><strong>E · 파열</strong><span>크고 강한 파괴 충격</span></button>
        <button data-file="heavy.ogg" data-rate=".78"><strong>F · 대형</strong><span>낮게 울리는 거대 충격</span></button>
        <button data-proc="flesh-hit"><strong>G · 살점</strong><span>금속음 없는 단단한 육체 타격</span></button>
        <button data-proc="soft-body"><strong>H · 물렁</strong><span>부드럽고 젖은 몸체에 박히는 충격</span></button>
        <button data-proc="bone-crack"><strong>I · 뼈</strong><span>짧게 부러지는 마른 충격</span></button>
        <button data-proc="deep-thud"><strong>J · 둔탁</strong><span>주먹이나 몽둥이가 박히는 소리</span></button>
        <button data-proc="giant-body"><strong>K · 거체</strong><span>큰 몸 전체가 울리는 저음 충격</span></button>
        <button data-proc="wood-crack"><strong>L · 목질</strong><span>나무·식물형 몸체가 갈라지는 소리</span></button>
      </div>
    </section>

    <section>
      <h2>공격 → 피격 조합</h2>
      <p class="hint">위에서 마지막으로 누른 공격음과 피격음을 실제 간격으로 재생합니다.</p>
      <button id="pairButton" class="pair"><strong>선택한 조합 듣기</strong><span id="pairLabel">공격 A + 피격 A</span></button>
    </section>

    <footer>마음에 드는 문자를 알려주세요.<br>예: “공격 C, 피격 D로 해줘.”</footer>
  </main>
  <script>
    (() => {
      const groups = [...document.querySelectorAll("section")].slice(0, 2);
      const selected = [groups[0].querySelector("button"), groups[1].querySelector("button")];
      const label = document.getElementById("pairLabel");
      const pool = new Map();
      const proceduralPool = new Map();
      let context;

      function audioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        context ||= new AudioContextClass();
        if (context.state === "suspended") context.resume().catch(() => {});
        return context;
      }

      function tone(frequency, duration, volume, endFrequency, type) {
        if (!audioContext()) return;
        const now = context.currentTime;
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(endFrequency, now + duration);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start(now);
        oscillator.stop(now + duration + .02);
      }

      const proceduralProfiles = {
        "blunt-swing": [.24, .024, 132, .72, .34, 0],
        "body-rush": [.34, .012, 88, .74, .58, 0],
        "club-swing": [.19, .052, 158, .66, .4, 1],
        "bite-snap": [.11, .16, 205, .52, .4, 2],
        "tail-sweep": [.38, .018, 102, .78, .33, 0],
        "ground-smash": [.34, .01, 61, .58, .82, 1],
        "flesh-hit": [.17, .036, 96, .82, .52, 1],
        "soft-body": [.24, .012, 69, .9, .48, 0],
        "bone-crack": [.13, .2, 172, .66, .3, 2],
        "deep-thud": [.21, .026, 81, .68, .72, 1],
        "giant-body": [.4, .008, 49, .62, .95, 1],
        "wood-crack": [.18, .1, 126, .72, .38, 2]
      };

      function proceduralWav(kind) {
        const [duration, smooth, base, noiseMix, bassMix, crack] = proceduralProfiles[kind];
        const sampleRate = 22050;
        const count = Math.ceil(duration * sampleRate);
        const samples = new Float32Array(count);
        let seed = [...kind].reduce((value, char) => value + char.charCodeAt(0), 71);
        let low = 0;
        for (let i = 0; i < count; i += 1) {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          const random = seed / 2147483648 - 1;
          low += (random - low) * smooth;
          const progress = i / count;
          const envelope = Math.pow(1 - progress, crack ? 3.6 : 2.1);
          const swing = kind.includes("swing") || kind.includes("rush") || kind.includes("sweep")
            ? Math.sin(Math.PI * progress)
            : envelope;
          const frequency = base * (1 - progress * .42);
          let value = low * noiseMix * (swing + envelope * .35);
          value += Math.sin(Math.PI * 2 * frequency * (i / sampleRate)) * bassMix * envelope;
          if (crack && (i < sampleRate * .012 || (crack > 1 && i > sampleRate * .047 && i < sampleRate * .057))) {
            value += (random - low) * .58;
          }
          samples[i] = Math.max(-1, Math.min(1, value * .78));
        }
        const buffer = new ArrayBuffer(44 + count * 2);
        const view = new DataView(buffer);
        const text = (offset, value) => [...value].forEach((char, index) => view.setUint8(offset + index, char.charCodeAt(0)));
        text(0, "RIFF"); view.setUint32(4, 36 + count * 2, true); text(8, "WAVE"); text(12, "fmt ");
        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true); text(36, "data"); view.setUint32(40, count * 2, true);
        samples.forEach((sample, index) => view.setInt16(44 + index * 2, sample * 32767, true));
        return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
      }

      function proceduralAudio(kind) {
        if (!proceduralPool.has(kind)) {
          const audio = new Audio(proceduralWav(kind));
          audio.preload = "auto";
          proceduralPool.set(kind, audio);
        }
        return proceduralPool.get(kind).cloneNode();
      }

      function playCurrentSynth(kind) {
        if (kind === "attack") tone(900, .13, .036, 170, "sawtooth");
        if (kind === "hit") {
          tone(105, .15, .045, 45, "square");
          tone(340, .06, .023, 95, "sawtooth");
        }
      }

      function audioFor(button) {
        const key = button.dataset.file;
        if (!key) {
          const audio = proceduralAudio(button.dataset.proc);
          audio.volume = 1;
          return audio;
        }
        if (!pool.has(key)) {
          const audio = new Audio(`assets/sfx/${key}`);
          audio.preload = "auto";
          pool.set(key, audio);
        }
        const audio = pool.get(key).cloneNode();
        audio.volume = .9;
        audio.playbackRate = Number(button.dataset.rate || 1);
        return audio;
      }

      function play(button) {
        document.querySelectorAll("button.is-playing").forEach(item => item.classList.remove("is-playing"));
        button.classList.add("is-playing");
        const audio = audioFor(button);
        if (button.dataset.synth) playCurrentSynth(button.dataset.synth);
        if (audio) audio.play().catch(() => {});
        window.setTimeout(() => button.classList.remove("is-playing"), 350);
      }

      document.querySelectorAll("[data-proc]").forEach(button => proceduralAudio(button.dataset.proc));

      groups.forEach((group, groupIndex) => {
        [...group.querySelectorAll("button")].forEach(button => button.addEventListener("click", () => {
          selected[groupIndex] = button;
          play(button);
          label.textContent = `공격 ${selected[0].querySelector("strong").textContent[0]} + 피격 ${selected[1].querySelector("strong").textContent[0]}`;
        }));
      });

      document.getElementById("pairButton").addEventListener("click", () => {
        play(selected[0]);
        window.setTimeout(() => play(selected[1]), 280);
      });
    })();
  </script>
</body>
</html>

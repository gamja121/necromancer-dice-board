name: Add book page turn SFX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact source audio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          page = "https://pixabay.com/sound-effects/film-special-effects-turning-page-in-a-book-419580/"
          req = urllib.request.Request(page, headers={"User-Agent":"Mozilla/5.0"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          urls = re.findall(r'https://cdn\.pixabay\.com/download/audio/[^"\\]+?\.mp3[^"\\]*', html)
          if not urls:
              urls = re.findall(r'https:\\/\\/cdn\.pixabay\.com\\/download\\/audio\\/[^"\\]+?\.mp3[^"\\]*', html)
              urls = [u.replace("\\/","/") for u in urls]
          if not urls:
              raise SystemExit("MP3 URL not found on source page")
          url = urls[0].replace("&amp;","&")
          print("source:", url)
          req2 = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Referer":page})
          data = urllib.request.urlopen(req2, timeout=30).read()
          if not (data.startswith(b"ID3") or data[:2] in (b"\xff\xfb", b"\xff\xf3", b"\xff\xf2")):
              raise SystemExit("Downloaded file is not MP3")
          open("assets/sfx/book-page-turn.mp3","wb").write(data)
          print("bytes:", len(data))
          PY
          file assets/sfx/book-page-turn.mp3
      - name: Commit SFX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx/book-page-turn.mp3
          git commit -m "audio: add book page turn sound effect"
          git push

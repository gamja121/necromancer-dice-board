name: Publish Godot to Existing Pages
# Altar upgrade plaque pilot 2026-10-11: inventory-only badges +1/+2/+3 independent of brands; Godot a6a1db23d5a0.
# Brand frames UI refresh 2026-10-11: align overlaps and apply to all monster card views; source 7f26e2bf127d.
# Preview refresh requested 2026-10-11: aligned 2/3-brand inventory borders from Godot 7b69d37869.

# The public Pages repository owns deployment. It builds the latest public
# Godot source directly; no cross-repository write token or Pages site creation
# in the Godot source repository is required.
# Font fix release: use bundled Nanum Gothic on title, intro, map and battle UI.
# Title-art release: rebuild the canonical Godot Pages preview with the new gothic logo and four menu buttons.
# Title-interaction release: publish fixed title UI and menu hover/press wiggle from current Godot main.
# HD title release: deploy verified 2172x724 logo and four 1086x295 transparent menu assets.
# Event illustration release: deploy ink-hatched fortune-teller camp and home interior backgrounds from Godot main e9a36afe.
# Ink opening pilot release: one fortune-teller-camp illustration only, source 98040e0c.
# All-location ink reveal release: 8 exterior/location scenes; home interior excluded. Godot 8f7747ea.
# Wax seal glow release: cemetery first-click skull marker and gentle red halo, Godot source 42ac87ca.
# Story state P1-02B: event stage and immutable choice save API, Godot source c8bd5388.
# Graveyard child P1-03B: ghoul reveal and rescue/abandon choice, Godot source 25b083c3.
# Graveyard child P1-03C: selected 1-4 monster cards vs ghoul, Godot source 9e9f2c77.
# Graveyard child P1-03D: persisted post-battle outcome modal, Godot source 0cb8fc31.
# Shared story battle contract P1-04A: reusable fail-closed registry, Godot source bb37bb4d.
# Shared story battle outcomes P1-04B: common victory/defeat flags and return modal, Godot source 9b3f2ef8.
# Story battle resume P1-04C: phase guards and acknowledged outcome retries, Godot source 3bd5162d.
# Village rumors P1-05A: rescue/abandon first discovery, Godot source c8ce8b0e.
# Village rumors P1-05B: both complete scenes and persisted beats, Godot source 600d1612.
# Knight commander P1-05C: arrival after saved-child rumor, Godot source 7f26e2bf.
# Knight commander P1-05D: seven dialogue beats and atomic hunter quest, Godot source 7564ce7b.
# Monster hunter P1-05E: guarded world-tree first arrival, Godot source 6caf3261.
# P1-05E integrated web sync: retain latest monster-card altar badge update, source a6a1db23.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-godot-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canonical-godot-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest public Godot source
        uses: actions/checkout@v4
        with:
          repository: gamja121/necromancer-and-dice-godot
          ref: main
          path: godot-game
          persist-credentials: false

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        working-directory: godot-game
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            exit 1
          fi

      - name: Startup check
        working-directory: godot-game
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' runtime.log; then
            exit 1
          fi

      - name: Export latest Godot Web build
        working-directory: godot-game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.pck
          test -s build/web/index.wasm

      - name: Prepare phone-friendly Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp godot-game/build/web/index.* _site/
          cp godot-game/web/landscape-lock.css _site/landscape-lock.css
          cp godot-game/web/landscape-lock.js _site/landscape-lock.js
          if [ -f godot-game/assets/fonts/OFL.txt ]; then
            cp godot-game/assets/fonts/OFL.txt _site/FONT_LICENSE.txt
          fi
          python3 - <<'PY'
          from pathlib import Path
          html = Path("_site/index.html")
          content = html.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="landscape-lock.css">'
          js = '<script src="landscape-lock.js" defer></script>'
          if css not in content:
              content = content.replace("</head>", f"  {css}\n</head>")
          if js not in content:
              content = content.replace("</body>", f"  {js}\n</body>")
          html.write_text(content, encoding="utf-8")
          PY
          git -C godot-game rev-parse HEAD > _site/SOURCE_SHA.txt
          cp _site/SOURCE_SHA.txt _site/DEPLOYED_SOURCE_SHA.txt
          grep -Eq '^[0-9a-f]{40}$' _site/DEPLOYED_SOURCE_SHA.txt
          for file in index.html index.js index.pck index.wasm landscape-lock.css landscape-lock.js; do
            test -s "_site/$file"
          done
          touch _site/.nojekyll

      - name: Configure existing Pages site
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy latest Godot build to existing Pages site
        id: deployment
        uses: actions/deploy-pages@v4

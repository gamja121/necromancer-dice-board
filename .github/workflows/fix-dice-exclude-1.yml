name: Fix dice control exclude 1 transparency

on:
  push:
    paths:
      - ".github/workflows/fix-dice-exclude-1.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Convert exact existing card to transparent PNG
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from collections import deque

          path = "art/v2-style/ui/dice-control-exclude-1.png"
          im = Image.open(path).convert("RGBA")
          w, h = im.size
          px = im.load()

          # Protect the card edge: any clearly non-black pixel, plus a 2 px halo,
          # is treated as foreground so the original black outline is preserved.
          seed = Image.new("L", (w, h), 0)
          sp = seed.load()
          for y in range(h):
              for x in range(w):
                  r, g, b, a = px[x, y]
                  if max(r, g, b) > 24:
                      sp[x, y] = 255
          protected = seed.filter(ImageFilter.MaxFilter(5))
          pp = protected.load()

          # Remove only edge-connected near-black background that is not protected.
          q = deque()
          seen = bytearray(w * h)
          def add(x, y):
              i = y * w + x
              if seen[i]:
                  return
              seen[i] = 1
              r, g, b, a = px[x, y]
              if max(r, g, b) <= 16 and pp[x, y] == 0:
                  q.append((x, y))

          for x in range(w):
              add(x, 0); add(x, h - 1)
          for y in range(h):
              add(0, y); add(w - 1, y)

          while q:
              x, y = q.popleft()
              r, g, b, a = px[x, y]
              px[x, y] = (r, g, b, 0)
              if x: add(x - 1, y)
              if x + 1 < w: add(x + 1, y)
              if y: add(x, y - 1)
              if y + 1 < h: add(x, y + 1)

          im.save(path, format="PNG", optimize=True)
          print("saved", path, im.size)
          PY
      - name: Commit corrected PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/ui/dice-control-exclude-1.png
          git commit -m "fix: make English exclude 1 a true transparent PNG"
          git push

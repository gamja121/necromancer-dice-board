name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Mandatory full regression suite
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        timeout-minutes: 5
        run: |
          node scripts/v2-dev-server.js > /tmp/v2-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8788/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8788/ > /dev/null
          npm run test:browser
      - name: Assemble Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/build-pages.js
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

name: Deploy Latest Godot Build

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Temporary ZIP URL from the latest successful Godot build"
        required: true
        type: string
      source_sha:
        description: "Godot source commit SHA being published"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canonical-godot-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download latest verified Godot build
        shell: bash
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             --output /tmp/godot-web.zip             "$ARTIFACT_URL"

      - name: Prepare canonical site
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          unzip -q /tmp/godot-web.zip -d _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/index.pck
          test -s _site/index.wasm
          test -s _site/landscape-lock.css
          test -s _site/landscape-lock.js
          printf '%s\n' "$SOURCE_SHA" > _site/DEPLOYED_SOURCE_SHA.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - name: Deploy canonical latest site
        id: deployment
        uses: actions/deploy-pages@v4

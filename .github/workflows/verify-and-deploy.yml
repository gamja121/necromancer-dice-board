name: Deploy Latest Godot Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canonical-godot-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate and prepare Godot site
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat SOURCE_SHA.txt)" = "$(cat DEPLOYED_SOURCE_SHA.txt)"
          grep -Eq '^[0-9a-f]{40}$' DEPLOYED_SOURCE_SHA.txt
          mkdir -p _site
          for file in index.html index.js index.pck index.wasm landscape-lock.css landscape-lock.js; do
            test -s "$file"
          done
          for file in index.* landscape-lock.css landscape-lock.js SOURCE_SHA.txt DEPLOYED_SOURCE_SHA.txt; do
            cp "$file" _site/
          done
          if [ -f FONT_LICENSE.txt ]; then cp FONT_LICENSE.txt _site/; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy canonical site
        id: deployment
        uses: actions/deploy-pages@v4

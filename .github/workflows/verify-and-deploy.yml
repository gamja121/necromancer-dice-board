name: Deploy Godot Web to existing Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-existing-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified Godot Web build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             --output /tmp/necromancer-godot-web.zip             'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-4350-8209-a696-4311711f2eef/raw?se=2026-10-09T04%3A02%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=7bc193e2-7253-5fab-b99f-855c1e0c726b&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A20%3A19Z&ske=2026-10-10T01%3A20%3A19Z&sks=b&skv=2026-02-06&sig=IIPTacgudtE/QVjHsBj7RcQkb7NVJrqvELV0zh6y0yM%3D'

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          unzip -q /tmp/necromancer-godot-web.zip -d _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/index.pck
          test -s _site/index.wasm
          test -s _site/landscape-lock.css
          test -s _site/landscape-lock.js
          grep -q 'landscape-lock.css' _site/index.html
          grep -q 'landscape-lock.js' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - name: Deploy to existing GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

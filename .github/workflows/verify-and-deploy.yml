name: Deploy Godot Web to existing Pages

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Temporary ZIP URL for a verified Godot Web build"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-existing-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified Godot Web build
        shell: bash
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             --output /tmp/necromancer-godot-web.zip             "$ARTIFACT_URL"

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          unzip -q /tmp/necromancer-godot-web.zip -d _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/index.pck
          test -s _site/index.wasm
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - name: Deploy to existing GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

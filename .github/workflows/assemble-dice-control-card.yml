name: Assemble dice control card

on:
  push:
    branches: [main]
    paths:
      - '.tmp/dice-control-card/**'
      - '.github/workflows/assemble-dice-control-card.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble PNG
        shell: bash
        run: |
          mkdir -p art/v2-style/ui
          cat .tmp/dice-control-card/part-*.b64 | tr -d '\n\r' | base64 --decode > art/v2-style/ui/dice-control-card.png
          file art/v2-style/ui/dice-control-card.png
          test "$(xxd -p -l 8 art/v2-style/ui/dice-control-card.png)" = "89504e470d0a1a0a"
          rm -rf .tmp/dice-control-card
          rm -f .github/workflows/assemble-dice-control-card.yml
      - name: Commit cutout asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: save cutout dice control card asset"
          git push

name: Altar transparent UI once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/altar-transparent-once.yml
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Remove connected black background and save RGBA PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path

          pairs = [
              ("art/v2-style/map-test/events/altar-ritual-slots.jpg",
               "art/v2-style/map-test/events/altar-ritual-slots.png"),
              ("art/v2-style/map-test/events/altar-ritual-info.jpg",
               "art/v2-style/map-test/events/altar-ritual-info.png"),
          ]

          def cutout(src, dst):
              im = Image.open(src).convert("RGBA")
              px = im.load()
              w, h = im.size
              seen = bytearray(w * h)
              q = deque()

              def dark(x, y):
                  r, g, b, a = px[x, y]
                  # Only remove near-black pixels connected to the outer image edge.
                  return a > 0 and max(r, g, b) <= 24

              def add(x, y):
                  i = y * w + x
                  if not seen[i] and dark(x, y):
                      seen[i] = 1
                      q.append((x, y))

              for x in range(w):
                  add(x, 0); add(x, h - 1)
              for y in range(h):
                  add(0, y); add(w - 1, y)

              while q:
                  x, y = q.popleft()
                  r, g, b, _ = px[x, y]
                  px[x, y] = (r, g, b, 0)
                  if x: add(x - 1, y)
                  if x + 1 < w: add(x + 1, y)
                  if y: add(x, y - 1)
                  if y + 1 < h: add(x, y + 1)

              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              im.save(dst, "PNG", optimize=True)
              alpha = im.getchannel("A")
              lo, hi = alpha.getextrema()
              if lo != 0 or hi != 255:
                  raise SystemExit(f"Alpha validation failed for {dst}: {(lo, hi)}")
              print(dst, im.size, im.mode, alpha.getextrema())

          for src, dst in pairs:
              cutout(src, dst)
          PY
      - name: Commit transparent altar UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/map-test/events/altar-ritual-slots.png art/v2-style/map-test/events/altar-ritual-info.png
          git commit -m "art: add transparent altar ritual UI"
          git push

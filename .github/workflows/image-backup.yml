name: Image Backup Export

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/image-backup.yml"

permissions:
  contents: read

jobs:
  export-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect image files only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-backup
          find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) \
            -not -path './.git/*' -print0 |
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            mkdir -p "image-backup/$(dirname "$rel")"
            cp -p "$file" "image-backup/$rel"
          done
          echo "image count: $(find image-backup -type f | wc -l)"
      - name: Upload image-only backup
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-images
          path: image-backup/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

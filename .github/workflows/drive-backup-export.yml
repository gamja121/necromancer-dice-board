name: Drive Backup Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drive-backup-export.yml'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create repository snapshot
        run: |
          mkdir -p _backup
          rsync -a --exclude='.git' --exclude='_backup' ./ _backup/necromancer-dice-board/
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-board-2026-10-01
          path: _backup/necromancer-dice-board
          compression-level: 6
          if-no-files-found: error
          retention-days: 1

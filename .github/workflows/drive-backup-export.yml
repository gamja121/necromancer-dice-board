name: Drive Backup Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drive-backup-export.yml'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create safe-size backup ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          import shutil

          root = Path(".")
          out = Path("_backup_parts")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          files = sorted(
              p for p in root.rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and "_backup_parts" not in p.parts
          )

          MAX = 55 * 1024 * 1024
          groups = []
          current = []
          used = 0

          for p in files:
              size = p.stat().st_size
              if current and used + size > MAX:
                  groups.append(current)
                  current = []
                  used = 0
              current.append(p)
              used += size

          if current:
              groups.append(current)

          for i, group in enumerate(groups, 1):
              zpath = out / f"necromancer-dice-board-2026-10-01-part-{i:02d}.zip"
              with zipfile.ZipFile(zpath, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
                  for p in group:
                      zf.write(p, arcname=Path("necromancer-dice-board") / p)
              print(zpath.name, zpath.stat().st_size, len(group))

          if len(groups) > 6:
              raise RuntimeError(f"Unexpected backup part count: {len(groups)}")
          PY

      - name: Upload backup part 01
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-board-2026-10-01-part-01
          path: _backup_parts/necromancer-dice-board-2026-10-01-part-01.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload backup part 02
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-board-2026-10-01-part-02
          path: _backup_parts/necromancer-dice-board-2026-10-01-part-02.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload backup part 03
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-board-2026-10-01-part-03
          path: _backup_parts/necromancer-dice-board-2026-10-01-part-03.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload backup part 04
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-board-2026-10-01-part-04
          path: _backup_parts/necromancer-dice-board-2026-10-01-part-04.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload backup part 05
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-board-2026-10-01-part-05
          path: _backup_parts/necromancer-dice-board-2026-10-01-part-05.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload backup part 06
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-board-2026-10-01-part-06
          path: _backup_parts/necromancer-dice-board-2026-10-01-part-06.zip
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1


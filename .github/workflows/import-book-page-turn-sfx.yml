name: Import book page turn SFX

on:
  push:
    paths:
      - ".github/workflows/import-book-page-turn-sfx.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source audio with browser DOM
        shell: bash
        run: |
          set -euo pipefail
          PAGE="https://pixabay.com/sound-effects/film-special-effects-turning-page-in-a-book-419580/"
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --dump-dom "$PAGE" > /tmp/pixabay.html
          python - <<'PY'
          import html, json, re, urllib.request
          text=open("/tmp/pixabay.html",encoding="utf-8",errors="ignore").read()
          candidates=[]
          for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', text, re.S|re.I):
              raw=html.unescape(m.group(1)).strip()
              try:
                  obj=json.loads(raw)
              except Exception:
                  continue
              objs=obj if isinstance(obj,list) else [obj]
              for item in objs:
                  if isinstance(item,dict):
                      url=item.get("contentUrl")
                      if isinstance(url,str) and ".mp3" in url:
                          candidates.append(url)
          if not candidates:
              m=re.search(r'https://cdn\.pixabay\.com/[^"\']+\.mp3[^"\']*', text)
              if m: candidates.append(html.unescape(m.group(0)))
          if not candidates:
              raise SystemExit("No direct MP3 URL found in browser DOM")
          url=candidates[0]
          print("audio url:", url)
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://pixabay.com/"})
          data=urllib.request.urlopen(req,timeout=30).read()
          print("bytes:",len(data))
          if not (data.startswith(b"ID3") or data[:2] in (b"\xff\xfb",b"\xff\xf3",b"\xff\xf2")):
              raise SystemExit("Downloaded content is not MP3")
          open("assets/sfx/book-page-turn.mp3","wb").write(data)
          PY
          file assets/sfx/book-page-turn.mp3
          wc -c assets/sfx/book-page-turn.mp3
      - name: Commit sound and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-book-page-turn-sfx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx/book-page-turn.mp3 .github/workflows/import-book-page-turn-sfx.yml
          git commit -m "audio: add book page turn sound effect"
          git push

name: Fix Korean dice control 1

on:
  push:
    paths:
      - ".github/workflows/fix-ko-dice-control-1.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: pip install pillow
      - name: Rebuild Korean card from English original
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import os, glob

          src = "art/v2-style/ui/dice-control-1.png"
          dst = "art/v2-style/ui/dice-control-ko-1.png"

          im = Image.open(src).convert("RGBA")
          w, h = im.size
          print("english size:", im.size)

          # Use the English card itself as the visual master.
          # Only clean the text interiors; leave borders, die, card texture and silhouette untouched.
          top_box = (51, 6, 143, 28)
          bottom_box = (48, 120, 145, 154)

          def soften_text(box, median=7, passes=3):
              crop = im.crop(box)
              for _ in range(passes):
                  crop = crop.filter(ImageFilter.MedianFilter(median))
              im.paste(crop, box)

          soften_text(top_box, 7, 3)
          soften_text(bottom_box, 7, 3)

          # Find an installed Korean-capable Noto font on ubuntu-latest.
          candidates = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJKkr-Regular.otf",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
          ]
          font_path = next((p for p in candidates if os.path.exists(p)), None)
          if not font_path:
              found = glob.glob("/usr/share/fonts/**/*NotoSans*CJK*Regular*", recursive=True)
              font_path = found[0] if found else None
          if not font_path:
              raise SystemExit("Korean font not found")

          draw = ImageDraw.Draw(im)

          def fit_font(text, max_w, max_h, start):
              for size in range(start, 4, -1):
                  f = ImageFont.truetype(font_path, size=size)
                  bb = draw.textbbox((0,0), text, font=f)
                  if bb[2]-bb[0] <= max_w and bb[3]-bb[1] <= max_h:
                      return f
              return ImageFont.truetype(font_path, size=5)

          def centered_text(box, text, font):
              x0,y0,x1,y1 = box
              bb = draw.textbbox((0,0), text, font=font)
              tw, th = bb[2]-bb[0], bb[3]-bb[1]
              x = x0 + ((x1-x0)-tw)/2 - bb[0]
              y = y0 + ((y1-y0)-th)/2 - bb[1]
              draw.text((x,y), text, font=font, fill=(18,20,16,255))

          top_font = fit_font("주사위 컨트롤", 82, 15, 10)
          centered_text((55,9,139,25), "주사위 컨트롤", top_font)

          # Two lines preserve the full Korean meaning without shrinking into illegibility.
          line1 = "주사위 눈금 1이"
          line2 = "나온다"
          f1 = fit_font(line1, 88, 10, 8)
          f2 = fit_font(line2, 88, 10, 8)
          centered_text((52,124,141,136), line1, f1)
          centered_text((52,137,141,149), line2, f2)

          im.save(dst, "PNG", optimize=True)
          chk = Image.open(dst)
          print("output:", chk.format, chk.mode, chk.size)
          print("alpha bbox:", chk.getchannel("A").getbbox())
          PY

      - name: Commit corrected Korean card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/ui/dice-control-ko-1.png
          git commit -m "fix: rebuild Korean dice control 1 card from English master"
          git push

name: Assemble title media

on:
  push:
    branches:
      - chatgpt/title-deploy-20260929
    paths:
      - ".title-upload/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/title-deploy-20260929
      - name: Assemble title package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .title-upload/package ]; then
            echo "No title upload chunks remain; nothing to assemble."
            exit 0
          fi
          mkdir -p /tmp/title-upload assets/title
          cat .title-upload/package/*.b64 | base64 -d > /tmp/title-compact.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          z = Path("/tmp/title-compact.zip")
          with ZipFile(z) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              archive.extractall(".")
          required = [
              "assets/title/title-loop.mp4",
              "assets/title/title-theme.mp3",
              "assets/title/title-logo.webp",
              "assets/title/menu-sprite.webp",
          ]
          missing = [p for p in required if not Path(p).is_file() or Path(p).stat().st_size == 0]
          if missing:
              raise SystemExit("Missing title assets: " + ", ".join(missing))
          PY
          rm -rf .title-upload
      - name: Commit assembled title assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/title .title-upload
          if git diff --cached --quiet; then
            echo "No assembled asset changes."
            exit 0
          fi
          git commit -m "art: add cinematic title media and menu assets"
          git push origin HEAD:chatgpt/title-deploy-20260929

name: Restyle Korean dice control 1 from Korean 3

on:
  push:
    paths:
      - ".github/workflows/restyle-ko-dice-control-1.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow and Korean font
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow

      - name: Rebuild Korean 1 using Korean 3 as style master
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import os, glob

          ref_path = "art/v2-style/ui/dice-control-ko-3.png"
          die_path = "art/v2-style/ui/dice-control-1.png"
          out_path = "art/v2-style/ui/dice-control-ko-1.png"

          ref = Image.open(ref_path).convert("RGBA")
          die_src = Image.open(die_path).convert("RGBA")

          print("ref:", ref.size, "die:", die_src.size)

          # Use KO-3 as the visual/style master so frame, panel tint,
          # text color, spacing and layout all match the approved Korean card.
          out = ref.copy()

          # Replace only the central die artwork with the die-1 artwork from EN-1.
          # The crop boxes are tuned to the 192px card family.
          die_crop = die_src.crop((58, 40, 138, 115))
          # Fit into KO-3's die area while preserving aspect ratio.
          target_box = (57, 43, 139, 119)
          tw, th = target_box[2]-target_box[0], target_box[3]-target_box[1]
          die_crop.thumbnail((tw, th), Image.Resampling.LANCZOS)

          # Preserve KO-3 frame around the die; paste only inside the cream panel.
          x = target_box[0] + (tw-die_crop.width)//2
          y = target_box[1] + (th-die_crop.height)//2
          out.alpha_composite(die_crop, (x, y))

          draw = ImageDraw.Draw(out)

          # Clean only the bottom text area, keeping KO-3's panel texture.
          # Median-filtered patch removes the old "3" sentence without replacing the panel style.
          bottom = (49, 132, 147, 170)
          crop = out.crop(bottom)
          for _ in range(4):
              crop = crop.filter(ImageFilter.MedianFilter(7))
          out.paste(crop, bottom)

          # Korean 3 uses a bold, dark Korean sans look.
          candidates = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJKkr-Bold.otf",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Bold.ttc",
          ]
          font_path = next((p for p in candidates if os.path.exists(p)), None)
          if not font_path:
              found = glob.glob("/usr/share/fonts/**/*NotoSans*CJK*Bold*", recursive=True)
              font_path = found[0] if found else None
          if not font_path:
              raise SystemExit("Korean bold font not found")

          text = "주사위 눈금 1이 나온다"
          # Match KO-3: single-line, bold, dark text centered in lower panel.
          for size in range(9, 5, -1):
              font = ImageFont.truetype(font_path, size=size)
              bb = draw.textbbox((0,0), text, font=font)
              if bb[2]-bb[0] <= 90:
                  break

          bb = draw.textbbox((0,0), text, font=font)
          tx = 98 - (bb[2]-bb[0])/2 - bb[0]
          ty = 151 - (bb[3]-bb[1])/2 - bb[1]
          draw.text((tx,ty), text, font=font, fill=(7,18,12,255))

          out.save(out_path, "PNG", optimize=True)
          chk = Image.open(out_path)
          print("output:", chk.format, chk.mode, chk.size)
          PY

      - name: Commit restyled Korean card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/ui/dice-control-ko-1.png
          git commit -m "fix: restyle Korean dice control 1 to match Korean 3"
          git push

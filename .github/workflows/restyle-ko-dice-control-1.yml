name: Restyle Korean dice control 1 from Korean 3

on:
  push:
    paths:
      - ".github/workflows/restyle-ko-dice-control-1.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools and Korean font
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow opencv-python-headless numpy

      - name: Convert Korean 3 into Korean 1 with minimal edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np, cv2, os, glob

          src = "art/v2-style/ui/dice-control-ko-3.png"
          dst = "art/v2-style/ui/dice-control-ko-1.png"

          base = Image.open(src).convert("RGBA")
          arr = np.array(base)
          rgb = cv2.cvtColor(arr[:,:,:3], cv2.COLOR_RGB2BGR)

          # Remove only KO-3's top-left and bottom-right pips.
          # Center pip remains untouched => die face becomes 1.
          mask = np.zeros(arr.shape[:2], dtype=np.uint8)
          cv2.circle(mask, (96, 68), 9, 255, -1)
          cv2.circle(mask, (133, 103), 12, 255, -1)
          rgb = cv2.inpaint(rgb, mask, 4, cv2.INPAINT_TELEA)

          arr[:,:,:3] = cv2.cvtColor(rgb, cv2.COLOR_BGR2RGB)
          out = Image.fromarray(arr, "RGBA")

          # Rebuild the lower sentence cleanly in the same KO-3 direction.
          arr = np.array(out)
          rgb = cv2.cvtColor(arr[:,:,:3], cv2.COLOR_RGB2BGR)
          text_mask = np.zeros(arr.shape[:2], dtype=np.uint8)

          # Remove the whole existing sentence band, leaving panel border untouched.
          cv2.rectangle(text_mask, (61, 145), (148, 162), 255, -1)
          rgb = cv2.inpaint(rgb, text_mask, 4, cv2.INPAINT_TELEA)
          arr[:,:,:3] = cv2.cvtColor(rgb, cv2.COLOR_BGR2RGB)
          out = Image.fromarray(arr, "RGBA")

          draw = ImageDraw.Draw(out)
          candidates = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJKkr-Bold.otf",
          ]
          font_path = next((p for p in candidates if os.path.exists(p)), None)
          if not font_path:
              found = glob.glob("/usr/share/fonts/**/*NotoSans*CJK*Bold*", recursive=True)
              font_path = found[0] if found else None
          if not font_path:
              raise SystemExit("Korean bold font not found")

          text = "주사위 눈금 1이 나온다"
          chosen = None
          for size in range(10, 6, -1):
              f = ImageFont.truetype(font_path, size=size)
              bb = draw.textbbox((0,0), text, font=f)
              if bb[2]-bb[0] <= 86 and bb[3]-bb[1] <= 12:
                  chosen = f
                  break
          if chosen is None:
              chosen = ImageFont.truetype(font_path, size=7)

          bb = draw.textbbox((0,0), text, font=chosen)
          cx, cy = 104, 153
          tx = cx - (bb[2]-bb[0])/2 - bb[0]
          ty = cy - (bb[3]-bb[1])/2 - bb[1]
          draw.text((tx,ty), text, font=chosen, fill=(8,20,13,255))

          out.save(dst, "PNG", optimize=True)
          print("saved:", dst, out.size)
          PY

      - name: Commit corrected Korean card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/ui/dice-control-ko-1.png
          git commit -m "fix: match Korean dice control 1 exactly to Korean 3 style"
          git push

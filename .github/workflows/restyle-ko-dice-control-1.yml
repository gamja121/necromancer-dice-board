name: Restyle Korean dice control 1 from Korean 3

on:
  push:
    paths:
      - ".github/workflows/restyle-ko-dice-control-1.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools and Korean font
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow opencv-python-headless numpy

      - name: Rebuild Korean 1 from Korean 3 visual master
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np, cv2, os, glob

          ref_path = "art/v2-style/ui/dice-control-ko-3.png"
          en1_path = "art/v2-style/ui/dice-control-1.png"
          out_path = "art/v2-style/ui/dice-control-ko-1.png"

          ref = Image.open(ref_path).convert("RGBA")
          en1 = Image.open(en1_path).convert("RGBA")
          out = ref.copy()

          # 1) Preserve KO-3 frame/card exactly.
          # Replace only the cream die-face interior with the EN-1 face.
          # Exclude the outer die border so no double frame appears.
          src_face = en1.crop((75, 47, 133, 105))
          dst_box = (80, 51, 138, 109)
          if src_face.size != (dst_box[2]-dst_box[0], dst_box[3]-dst_box[1]):
              src_face = src_face.resize((dst_box[2]-dst_box[0], dst_box[3]-dst_box[1]), Image.Resampling.LANCZOS)
          out.paste(src_face, (dst_box[0], dst_box[1]), src_face)

          # 2) Remove KO-3 lower sentence while preserving the panel texture.
          arr = np.array(out)
          rgb = cv2.cvtColor(arr[:,:,:3], cv2.COLOR_RGB2BGR)
          mask = np.zeros(arr.shape[:2], dtype=np.uint8)

          # lower label interior only
          x0,y0,x1,y1 = 57,143,151,164
          roi = arr[y0:y1, x0:x1, :3]
          # dark text pixels; keep panel border untouched
          dark = np.all(roi < np.array([90,90,90]), axis=2)
          mask[y0:y1, x0:x1][dark] = 255

          # slightly expand mask so old glyph edges disappear cleanly
          kernel = np.ones((3,3), np.uint8)
          mask = cv2.dilate(mask, kernel, iterations=1)
          cleaned = cv2.inpaint(rgb, mask, 3, cv2.INPAINT_TELEA)
          cleaned = cv2.cvtColor(cleaned, cv2.COLOR_BGR2RGB)
          arr[:,:,:3] = cleaned
          out = Image.fromarray(arr, "RGBA")

          # 3) Draw one-line Korean sentence in the same bold/dark direction as KO-3.
          draw = ImageDraw.Draw(out)
          candidates = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJKkr-Bold.otf",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Bold.ttc",
          ]
          font_path = next((p for p in candidates if os.path.exists(p)), None)
          if not font_path:
              found = glob.glob("/usr/share/fonts/**/*NotoSans*CJK*Bold*", recursive=True)
              font_path = found[0] if found else None
          if not font_path:
              raise SystemExit("Korean bold font not found")

          text = "주사위 눈금 1이 나온다"
          font = None
          for size in range(10, 5, -1):
              f = ImageFont.truetype(font_path, size=size)
              bb = draw.textbbox((0,0), text, font=f)
              if bb[2]-bb[0] <= 88 and bb[3]-bb[1] <= 13:
                  font = f
                  break
          if font is None:
              font = ImageFont.truetype(font_path, size=6)

          bb = draw.textbbox((0,0), text, font=font)
          cx, cy = 104, 153
          tx = cx - (bb[2]-bb[0])/2 - bb[0]
          ty = cy - (bb[3]-bb[1])/2 - bb[1]
          draw.text((tx,ty), text, font=font, fill=(8,20,13,255))

          out.save(out_path, "PNG", optimize=True)
          print("saved", out_path, out.size)
          PY

      - name: Commit corrected Korean card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/ui/dice-control-ko-1.png
          git commit -m "fix: align Korean dice control 1 with Korean 3"
          git push

name: Restyle Korean dice control 1 from Korean 3

on:
  push:
    paths:
      - ".github/workflows/restyle-ko-dice-control-1.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow and Korean font
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow

      - name: Make Korean 1 by minimally editing Korean 3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os, glob

          src = "art/v2-style/ui/dice-control-ko-3.png"
          dst = "art/v2-style/ui/dice-control-ko-1.png"
          im = Image.open(src).convert("RGBA")

          # KO-3 is the complete visual master.
          # Remove only the top-left and bottom-right pips by copying
          # nearby blank cream texture from the same die face.
          def copy_patch(src_box, dst_xy):
              patch = im.crop(src_box)
              im.paste(patch, dst_xy)

          # cover top-left pip with nearby top-right blank die texture
          copy_patch((118, 57, 132, 71), (88, 62))
          # cover bottom-right pip with nearby bottom-left blank die texture
          copy_patch((83, 94, 99, 110), (126, 96))

          # Bottom label stays exactly as KO-3 except numeral 3 -> 1.
          draw = ImageDraw.Draw(im)

          # Find dark-pixel column groups in the lower label, then replace
          # the sixth glyph-group (the numeral) only.
          x0,y0,x1,y1 = 57,142,151,163
          groups=[]
          in_group=False
          start=None
          for x in range(x0,x1):
              dark=False
              for y in range(y0,y1):
                  r,g,b,a=im.getpixel((x,y))
                  if a>0 and r<70 and g<70 and b<70:
                      dark=True
                      break
              if dark and not in_group:
                  start=x; in_group=True
              elif not dark and in_group:
                  if x-start>=2:
                      groups.append((start,x-1))
                  in_group=False
          if in_group:
              groups.append((start,x1-1))

          # Merge tiny gaps inside glyphs.
          merged=[]
          for g in groups:
              if merged and g[0]-merged[-1][1] <= 2:
                  merged[-1]=(merged[-1][0],g[1])
              else:
                  merged.append(g)
          print("bottom groups:", merged)

          # Identify numeral 3 by selecting a narrow Latin-digit-like group
          # around the center of the sentence.
          candidates=[g for g in merged if 96 <= (g[0]+g[1])//2 <= 118]
          if not candidates:
              raise SystemExit("Could not locate numeral 3")
          num_box=min(candidates, key=lambda g: abs(((g[0]+g[1])//2)-107))
          gx0,gx1=num_box
          erase=(gx0-2, y0-2, gx1+3, y1+2)

          # Fill numeral area using clean panel texture from adjacent area.
          ew,eh=erase[2]-erase[0], erase[3]-erase[1]
          texture=im.crop((erase[0]-ew-3, erase[1], erase[0]-3, erase[3]))
          if texture.size != (ew,eh):
              texture=texture.resize((ew,eh))
          im.paste(texture, (erase[0],erase[1]))

          candidates_font=[
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJKkr-Bold.otf",
          ]
          font_path=next((p for p in candidates_font if os.path.exists(p)), None)
          if not font_path:
              found=glob.glob("/usr/share/fonts/**/*NotoSans*CJK*Bold*",recursive=True)
              font_path=found[0] if found else None
          if not font_path:
              raise SystemExit("Bold Korean font not found")

          # Match the reference numeral height and position.
          font=ImageFont.truetype(font_path, size=9)
          bb=draw.textbbox((0,0),"1",font=font)
          cx=(gx0+gx1)/2
          cy=153
          tx=cx-(bb[2]-bb[0])/2-bb[0]
          ty=cy-(bb[3]-bb[1])/2-bb[1]
          draw.text((tx,ty),"1",font=font,fill=(8,19,13,255))

          im.save(dst,"PNG",optimize=True)
          print("saved:",dst,im.size)
          PY

      - name: Commit corrected Korean card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/ui/dice-control-ko-1.png
          git commit -m "fix: match Korean dice control 1 to Korean 3 style"
          git push

name: Incremental Backup Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/incremental-backup-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build incremental backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incremental-backup
          cat > incremental-backup/BACKUP_MANIFEST.txt <<'EOF'
          Base full backup commit: cd6750bb246933efb6dd7c82523aa132b3bf90c3
          Incremental target commit: e43d817fe239a40fbcd8d80913192d52879a65c2
          Date: 2026-10-02
          Files: 16
          EOF
          python - <<'PY'
          from pathlib import Path
          import shutil
          files = [
            ".github/workflows/verify-and-deploy.yml",
            "BACKUP_CLEANUP_CHECKLIST.md",
            "index.html",
            "launch.css",
            "launch.js",
            "service-worker.js",
            "test_v2_rules_ui.js",
            "test_v2_unit_cards.js",
            "v2-auto-battle-practice.css",
            "v2-auto-battle-practice.html",
            "v2-auto-battle-practice.js",
            "v2-heal-effect.js",
            "v2-map-practice.css",
            "v2-map-practice.html",
            "v2-map-practice.js",
            "v2-unit-cards.js",
          ]
          out = Path("incremental-backup/files")
          for rel in files:
              src = Path(rel)
              if not src.exists():
                  raise SystemExit(f"missing: {rel}")
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          print("copied", len(files))
          PY
      - name: Upload incremental backup
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-incremental-2026-10-02
          path: incremental-backup/
          compression-level: 6
          retention-days: 1

name: Incremental Backup Export Corrected

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/incremental-backup-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build corrected incremental ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incremental-backup
          mkdir -p incremental-backup/files/.github/workflows
          printf '%s\n' \
            'Base full backup commit: cd6750bb246933efb6dd7c82523aa132b3bf90c3' \
            'Incremental target commit: e43d817fe239a40fbcd8d80913192d52879a65c2' \
            'Date: 2026-10-02' \
            'Files: 16' > incremental-backup/BACKUP_MANIFEST.txt
          cp .github/workflows/verify-and-deploy.yml incremental-backup/files/.github/workflows/
          cp BACKUP_CLEANUP_CHECKLIST.md incremental-backup/files/
          cp index.html launch.css launch.js service-worker.js incremental-backup/files/
          cp test_v2_rules_ui.js test_v2_unit_cards.js incremental-backup/files/
          cp v2-auto-battle-practice.css v2-auto-battle-practice.html v2-auto-battle-practice.js incremental-backup/files/
          cp v2-heal-effect.js incremental-backup/files/
          cp v2-map-practice.css v2-map-practice.html v2-map-practice.js incremental-backup/files/
          cp v2-unit-cards.js incremental-backup/files/
          (cd incremental-backup && zip -r ../necromancer-dice-incremental-2026-10-02.zip .)
      - name: Upload corrected incremental ZIP
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-dice-incremental-2026-10-02-corrected
          path: necromancer-dice-incremental-2026-10-02.zip
          compression-level: 0
          retention-days: 1

name: Split treasure chest frames

on:
  push:
    paths:
      - ".github/workflows/temp-split-treasure-chest.yml"

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Split original treasure sprite into four trimmed PNG frames
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("art/v2-style/map-test/events/treasure-chest-sprite.png")
          img = Image.open(src).convert("RGBA")
          w, h = img.size

          # The source artwork is not laid out as four equal cells.
          # These ranges isolate the four authored poses while preserving
          # each pose's glow/rays. Transparent margins are trimmed afterward.
          ranges = [
              (0, 410),
              (430, 835),
              (855, 1240),
              (1245, w),
          ]

          out_dir = src.parent
          for i, (x0, x1) in enumerate(ranges, start=1):
              crop = img.crop((x0, 0, x1, h))
              alpha = crop.getchannel("A")
              bbox = alpha.getbbox()
              if bbox:
                  crop = crop.crop(bbox)
              # Add transparent breathing room so glow/shadow never touches the edge.
              pad = 18
              canvas = Image.new("RGBA", (crop.width + pad * 2, crop.height + pad * 2), (0, 0, 0, 0))
              canvas.alpha_composite(crop, (pad, pad))
              out = out_dir / f"treasure-chest-frame-{i}.png"
              canvas.save(out, "PNG", optimize=True)
              print(i, out, canvas.size)
          PY
      - name: Commit split frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/map-test/events/treasure-chest-frame-1.png \
                  art/v2-style/map-test/events/treasure-chest-frame-2.png \
                  art/v2-style/map-test/events/treasure-chest-frame-3.png \
                  art/v2-style/map-test/events/treasure-chest-frame-4.png
          git diff --cached --quiet && exit 0
          git commit -m "art: split treasure chest animation frames"
          git push

name: Assemble book page turn SFX

on:
  push:
    paths:
      - ".github/workflows/assemble-book-page-turn-sfx.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild uploaded MP3
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/book-page-turn.b64.1 \
            .tmp/book-page-turn.b64.2 \
            .tmp/book-page-turn.b64.3 \
            .tmp/book-page-turn.b64.4 \
            | base64 -d > assets/sfx/book-page-turn.mp3

          test "$(wc -c < assets/sfx/book-page-turn.mp3)" -eq 23808
          echo "170023a6ce7840b7b8ab96576201c6170be7bfabc870a8502f805f09f4ac1024  assets/sfx/book-page-turn.mp3" | sha256sum -c -
          file assets/sfx/book-page-turn.mp3

      - name: Commit final SFX and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .tmp/book-page-turn.b64.1 \
            .tmp/book-page-turn.b64.2 \
            .tmp/book-page-turn.b64.3 \
            .tmp/book-page-turn.b64.4 \
            .github/workflows/import-book-page-turn-sfx.yml \
            .github/workflows/assemble-book-page-turn-sfx.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audio: add book page turn sound effect"
          git push

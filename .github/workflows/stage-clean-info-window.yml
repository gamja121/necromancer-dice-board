name: Stage clean info window
on:
  push:
    paths:
      - ".asset-stage/**"

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify clean info window
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-stage/legion-info-window-hd-clean.*.b64 > /tmp/info-window.b64
          base64 -d /tmp/info-window.b64 > art/v2-style/ui/legion-info-window-hd-clean.webp
          python3 - <<'PY'
          import hashlib
          p = "art/v2-style/ui/legion-info-window-hd-clean.webp"
          b = open(p, "rb").read()
          assert len(b) == 46706, len(b)
          assert b[:4] == b"RIFF" and b[8:12] == b"WEBP"
          h = hashlib.sha1(b"blob " + str(len(b)).encode() + b"\0" + b).hexdigest()
          assert h == "eeb6e0029614dbec9653ab8ab47e6373dc16ee18", h
          print("verified", len(b), h)
          PY
      - name: Commit verified asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v2-style/ui/legion-info-window-hd-clean.webp
          git rm .asset-stage/*.b64
          git commit -m "asset: install verified clean info window"
          git push

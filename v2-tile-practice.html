<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0907">
  <title>타일 기능 테스트 · 집</title>
  <link rel="stylesheet" href="v2-map-practice.css?v=18">
  <link rel="stylesheet" href="v2-tile-practice.css?v=1">
  <link rel="stylesheet" href="v2-home-inheritance.css?v=3">
</head>
<body data-v2-music="map">
  <main class="map-lab">
    <section class="map-board" aria-label="집 타일 기능 테스트">
      <div class="map-shade" aria-hidden="true"></div>
      <nav class="tile-test-nav" aria-label="타일 테스트 탐색">
        <a href="v2-map-practice.html">← 지도</a>
        <strong>타일 기능 테스트 · 집</strong>
      </nav>
      <section class="tile-event-overlay" aria-label="집 타일 장면">
        <div class="tile-event-scene">
          <img id="tileTestImage" src="art/v2-style/map-test/events/home.jpg" alt="우리집 바깥 풍경">
          <button id="tileTestEnter" class="tile-event-enter" type="button">들어가기</button>
          <button id="tileTestInheritance" class="tile-event-enter" type="button" hidden>낙인 계승</button>
          <button id="tileTestExit" class="tile-event-exit" type="button">나가기</button>
        </div>
      </section>
      <section id="homeInheritanceOverlay" class="home-inheritance-overlay" role="dialog" aria-modal="true" aria-label="낙인 계승" hidden>
        <button class="home-inheritance-backdrop" type="button" aria-label="낙인 계승 창 닫기"></button>
        <div class="home-inheritance-layout">
          <div class="home-inheritance-panel home-inheritance-material" role="group" aria-label="재료 마물">
            <strong class="home-inheritance-panel-title">재료</strong>
            <img id="homeInheritanceMaterialCard" class="home-inheritance-panel-card" alt="" hidden>
            <span id="homeInheritanceMaterialHint" class="home-inheritance-panel-hint">아래에서 마물을 선택</span>
          </div>
          <section class="home-inheritance-brand-box" aria-label="선택한 마물의 낙인" aria-live="polite">
            <h3>낙인 확인</h3>
            <p id="homeInheritanceBrandHint">재료 카드를 선택하세요</p>
            <ul id="homeInheritanceBrandList" hidden></ul>
          </section>
          <div class="home-inheritance-panel home-inheritance-result" role="group" aria-label="계승 결과">
            <strong class="home-inheritance-panel-title">결과</strong>
            <img id="homeInheritanceResultCard" class="home-inheritance-panel-card" alt="" hidden>
            <span id="homeInheritanceResultHint" class="home-inheritance-panel-hint">계승 결과 대기</span>
          </div>
        </div>
        <button id="homeInheritanceConfirm" class="home-inheritance-confirm" type="button" disabled>계승</button>
        <button id="homeInheritanceClose" class="home-inheritance-close" type="button">닫기</button>
        <div id="homeInheritanceCards" class="home-inheritance-cards map-deck-roster" aria-label="보유 마물 카드 10장"></div>
      </section>
    </section>
  </main>
  <script src="v2-landscape.js?v=1"></script>
  <script src="v2-music.js?v=1"></script>
  <script src="v2-design-data.js?v=1"></script>
  <script src="v2-rules.js?v=4"></script>
  <script src="v2-home-inheritance.js?v=3"></script>
  <script src="v2-tile-practice.js?v=2"></script>
</body>
</html>

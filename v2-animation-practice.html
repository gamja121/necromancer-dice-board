<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">
  <title>V2 모션 테스트</title>
  <link rel="stylesheet" href="v2-animation-practice.css?v=2">
</head>
<body>
  <main class="motion-app">
    <header class="motion-header">
      <div><span class="eyebrow">V2 MOTION LAB</span><h1>모션 테스트</h1></div>
      <a class="home-button" href="index.html" aria-label="시작 화면으로 돌아가기">⌂</a>
    </header>

    <section class="unit-picker" aria-label="테스트 유닛 선택">
      <button id="prevUnitBtn" type="button" aria-label="이전 유닛">◀</button>
      <label for="unitSelect">테스트 유닛</label>
      <select id="unitSelect"></select>
      <button id="nextUnitBtn" type="button" aria-label="다음 유닛">▶</button>
    </section>

    <section id="motionStage" class="motion-stage" aria-label="선택한 유닛 모션 무대">
      <div class="stage-shade"></div>
      <div class="stage-heading">
        <span id="unitGrade" class="grade-badge">일반</span>
        <strong id="unitName">유닛</strong>
        <span id="frameCounter">대기</span>
      </div>
      <p id="motionStatus" class="motion-status">모션을 준비하고 있습니다.</p>
      <div class="single-unit">
        <img id="unitSprite" alt="선택한 테스트 유닛">
        <span class="unit-shadow" aria-hidden="true"></span>
      </div>
    </section>

    <section class="motion-controls" aria-label="모션 재생 버튼">
      <button id="attackBtn" type="button" disabled><span>⚔</span>공격 모션</button>
      <button id="hitBtn" type="button" disabled><span>✦</span>피격 모션</button>
      <button id="deathBtn" type="button" disabled><span>☠</span>사망 모션</button>
    </section>

    <section class="lab-footer">
      <button id="resetBtn" type="button">처음 자세</button>
      <button id="battlefieldBtn" type="button">전장 변경</button>
      <p><strong id="unitCount">0 / 44</strong><span>한 번에 한 유닛의 실제 전투 모션만 재생합니다.</span></p>
    </section>
  </main>

  <script src="unit-data.js?v=45"></script>
  <script src="v2-motion.js?v=5"></script>
  <script src="v2-animation-practice.js?v=3"></script>
</body>
</html>

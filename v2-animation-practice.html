<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">
  <title>구울 누끼 비교 테스트</title>
  <link rel="stylesheet" href="v2-animation-practice.css?v=3">
</head>
<body>
  <main class="motion-app">
    <header class="motion-header">
      <div><span class="eyebrow">V2 MOTION LAB</span><h1>구울 누끼 비교</h1></div>
      <a class="home-button" href="index.html" aria-label="시작 화면으로 돌아가기">⌂</a>
    </header>

    <section class="compare-note">
      <strong>같은 모션 · 같은 크기 · 같은 전장</strong>
      <span>왼쪽 JPG와 오른쪽 PNG의 윤곽, 발끝, 붉은 효과를 비교하세요.</span>
    </section>

    <section id="motionStage" class="motion-stage" aria-label="JPG와 PNG 구울 모션 비교 무대">
      <div class="stage-shade"></div>
      <div class="stage-heading"><strong>구울</strong><span id="frameCounter">대기 자세</span></div>
      <div class="compare-units">
        <article class="compare-unit" data-source="jpg">
          <h2><b>JPG</b><span>JPG 원본 누끼</span></h2>
          <div class="sprite-box"><img id="jpgSprite" alt="JPG 원본으로 처리한 구울"><span class="unit-shadow" aria-hidden="true"></span></div>
        </article>
        <div class="compare-divider" aria-hidden="true"></div>
        <article class="compare-unit" data-source="png">
          <h2><b>PNG</b><span>PNG 원본 누끼</span></h2>
          <div class="sprite-box"><img id="pngSprite" alt="PNG 원본으로 처리한 구울"><span class="unit-shadow" aria-hidden="true"></span></div>
        </article>
      </div>
      <p id="motionStatus" class="motion-status">두 결과를 불러오고 있습니다.</p>
    </section>

    <section class="motion-controls" aria-label="동시 모션 재생 버튼">
      <button id="attackBtn" type="button" disabled><span>⚔</span>공격 비교</button>
      <button id="hitBtn" type="button" disabled><span>✦</span>피격 비교</button>
      <button id="deathBtn" type="button" disabled><span>☠</span>사망 비교</button>
    </section>
    <section class="lab-footer">
      <button id="resetBtn" type="button" disabled>처음 자세</button>
      <button id="battlefieldBtn" type="button">전장 변경</button>
      <p>본게임에는 적용하지 않은 비교 전용 테스트입니다.</p>
    </section>
  </main>
  <script src="v2-animation-practice.js?v=6"></script>
</body>
</html>

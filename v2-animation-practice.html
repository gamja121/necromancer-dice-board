<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">
  <title>유닛 모션 테스트</title>
  <link rel="stylesheet" href="v2-animation-practice.css?v=5">
</head>
<body>
  <main class="motion-app">
    <header class="motion-header">
      <div><span class="eyebrow">V2 MOTION LAB</span><h1>유닛 모션 테스트</h1></div>
      <a class="home-button" href="index.html" aria-label="시작 화면으로 돌아가기">⌂</a>
    </header>
    <section class="compare-note">
      <strong>녹색 배경 원본 적용</strong>
      <span>유닛을 바꿔 공격·피격·사망 모션의 외곽과 무기 끝을 확인하세요.</span>
    </section>
    <nav class="unit-picker" aria-label="테스트 유닛 선택">
      <button class="unit-button is-active" type="button" data-unit="death-knight">데스나이트</button>
      <button class="unit-button" type="button" data-unit="skeleton-spear">해골 창병</button>
      <button class="unit-button" type="button" data-unit="ancient-treant">고대 트렌트</button>
      <button class="unit-button" type="button" data-unit="stone-golem">암석 골렘</button>
      <button class="unit-button" type="button" data-unit="goblin-rider">고블린 라이더</button>
      <button class="unit-button" type="button" data-unit="orc-warrior">오크 전사</button>
      <button class="unit-button" type="button" data-unit="boulder-ogre">오우거</button>
      <button class="unit-button" type="button" data-unit="goblin-commoner">평민고블린</button>
      <button class="unit-button" type="button" data-unit="ice-lord">얼음 군주</button>
      <button class="unit-button" type="button" data-unit="yeti">설인</button>
      <button class="unit-button" type="button" data-unit="ghoul">구울</button>
      <button class="unit-button" type="button" data-unit="minotaur">미노타우로스</button>
      <button class="unit-button" type="button" data-unit="skeleton-cavalry">해골 기사</button>
      <button class="unit-button" type="button" data-unit="soul-reaper">영혼 수확자</button>
      <button class="unit-button" type="button" data-unit="mummy-guardian">미라 수호병</button>
      <button class="unit-button" type="button" data-unit="doom-executor">석상 가고일</button>
      <button class="unit-button" type="button" data-unit="plague-frog">역병 개구리</button>
      <button class="unit-button" type="button" data-unit="plague-doctor">역병술사</button>
      <button class="unit-button" type="button" data-unit="goblin-chief">고블린족장</button>
      <button class="unit-button" type="button" data-unit="grave-priest">묘지 사제</button>
      <button class="unit-button" type="button" data-unit="forest-fairy">숲 요정</button>
      <button class="unit-button" type="button" data-unit="mushroom-soldier">버섯 병사</button>
      <button class="unit-button" type="button" data-unit="spider-knight">거미여왕</button>
      <button class="unit-button" type="button" data-unit="skeleton-archer">해골 궁수</button>
      <button class="unit-button" type="button" data-unit="sea-wolf">바다 늑대</button>
      <button class="unit-button" type="button" data-unit="abyss-eye">외눈 괴물</button>
      <button class="unit-button" type="button" data-unit="kraken">크라켄</button>
      <button class="unit-button" type="button" data-unit="raging-treant">분노한 고목</button>
      <button class="unit-button" type="button" data-unit="crystal-devourer">결정 포식화</button>
      <button class="unit-button" type="button" data-unit="grave-worm">역병 벌레</button>
    </nav>
    <section id="motionStage" class="motion-stage" aria-label="유닛 모션 테스트 무대">
      <div class="stage-shade"></div>
      <div class="stage-heading"><strong id="unitName">데스나이트</strong><span id="frameCounter">대기 자세</span></div>
      <div class="compare-units single-unit">
        <article class="compare-unit" data-source="green-screen">
          <div class="sprite-box"><img id="unitSprite" alt="선택한 테스트 유닛"><span class="unit-shadow" aria-hidden="true"></span></div>
        </article>
      </div>
      <p id="motionStatus" class="motion-status">새 프레임을 불러오고 있습니다.</p>
    </section>
    <section class="motion-controls" aria-label="모션 재생 버튼">
      <button id="attackBtn" type="button" disabled><span>⚔</span>공격 모션</button>
      <button id="hitBtn" type="button" disabled><span>✦</span>피격 모션</button>
      <button id="deathBtn" type="button" disabled><span>☠</span>사망 모션</button>
    </section>
    <section class="lab-footer">
      <button id="resetBtn" type="button" disabled>처음 자세</button>
      <button id="battlefieldBtn" type="button">전장 변경</button>
      <p>본게임에는 아직 적용하지 않은 유닛별 검수용 테스트입니다.</p>
    </section>
  </main>
  <script src="v2-animation-practice.js?v=44"></script>
</body>
</html>

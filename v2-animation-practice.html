<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">
  <title>데스나이트 모션 테스트</title>
  <link rel="stylesheet" href="v2-animation-practice.css?v=4">
</head>
<body>
  <main class="motion-app">
    <header class="motion-header">
      <div><span class="eyebrow">V2 MOTION LAB</span><h1>데스나이트 모션 테스트</h1></div>
      <a class="home-button" href="index.html" aria-label="시작 화면으로 돌아가기">⌂</a>
    </header>
    <section class="compare-note">
      <strong>새 녹색 배경 원본 적용</strong>
      <span>공격·피격·사망 모션의 외곽, 발끝, 검과 영혼 효과를 확인하세요.</span>
    </section>
    <section id="motionStage" class="motion-stage" aria-label="데스나이트 모션 테스트 무대">
      <div class="stage-shade"></div>
      <div class="stage-heading"><strong>데스나이트</strong><span id="frameCounter">대기 자세</span></div>
      <div class="compare-units single-unit">
        <article class="compare-unit" data-source="green-screen">
          <div class="sprite-box"><img id="unitSprite" alt="새 원본으로 처리한 데스나이트"><span class="unit-shadow" aria-hidden="true"></span></div>
        </article>
      </div>
      <p id="motionStatus" class="motion-status">새 프레임을 불러오고 있습니다.</p>
    </section>
    <section class="motion-controls" aria-label="모션 재생 버튼">
      <button id="attackBtn" type="button" disabled><span>⚔</span>공격 모션</button>
      <button id="hitBtn" type="button" disabled><span>✦</span>피격 모션</button>
      <button id="deathBtn" type="button" disabled><span>☠</span>사망 모션</button>
    </section>
    <section class="lab-footer">
      <button id="resetBtn" type="button" disabled>처음 자세</button>
      <button id="battlefieldBtn" type="button">전장 변경</button>
      <p>본게임에는 아직 적용하지 않은 단일 유닛 검수용 테스트입니다.</p>
    </section>
  </main>
  <script src="v2-animation-practice.js?v=7"></script>
</body>
</html>

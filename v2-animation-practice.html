<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">
  <title>V2 모션 연습장</title>
  <link rel="stylesheet" href="v2-animation-practice.css">
</head>
<body>
  <main class="practice-app">
    <header class="practice-header">
      <div>
        <span class="eyebrow">V2 ANIMATION LAB</span>
        <h1>고블린 대 미노타우르스</h1>
      </div>
      <button id="resetBtn" class="icon-button" type="button" aria-label="전투 초기화" title="전투 초기화">↻</button>
    </header>

    <section class="stage" aria-label="애니메이션 연습 전장">
      <div class="stage-sky"></div>
      <div class="stage-castle"></div>
      <div class="stage-ground"></div>
      <p id="battleStatus" class="battle-status">모션 시트를 준비하고 있습니다.</p>
      <div id="impactFx" class="impact-fx" aria-hidden="true"></div>

      <article id="goblinFighter" class="fighter fighter-player">
        <div class="fighter-label">
          <strong>고블린 병사</strong>
          <span id="goblinHpText">3 / 3</span>
        </div>
        <div class="hp-track"><span id="goblinHpBar"></span></div>
        <img id="goblinSprite" class="fighter-sprite" alt="고블린 병사">
        <span class="fighter-shadow"></span>
      </article>

      <article id="minotaurFighter" class="fighter fighter-enemy">
        <div class="fighter-label">
          <strong>미노타우르스</strong>
          <span id="minotaurHpText">5 / 5</span>
        </div>
        <div class="hp-track"><span id="minotaurHpBar"></span></div>
        <img id="minotaurSprite" class="fighter-sprite" alt="미노타우르스">
        <span class="fighter-shadow"></span>
      </article>
    </section>

    <section class="controls" aria-label="애니메이션 제어">
      <button id="goblinAttackBtn" type="button" disabled>고블린 공격</button>
      <button id="autoDemoBtn" type="button" class="primary" disabled>자동 시연</button>
      <button id="minotaurAttackBtn" type="button" disabled>미노타우르스 공격</button>
    </section>

    <section class="motion-note">
      <strong>사용 모션</strong>
      <span>공격 · 피격 · 사망</span>
      <p>시트에서 필요한 포즈만 잘라 순서대로 재생합니다. 기존 V2 전투 규칙과 자산은 변경하지 않습니다.</p>
    </section>
  </main>
  <script src="v2-animation-practice.js"></script>
</body>
</html>

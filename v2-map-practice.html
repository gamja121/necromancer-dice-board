<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0907">
  <title>외곽 타일 맵 테스트</title>
  <link rel="stylesheet" href="v2-map-practice.css?v=18">
  <link rel="stylesheet" href="v2-home-inheritance.css?v=4">
</head>
<body data-v2-music="map">
  <main class="map-lab">
    <section id="mapBoard" class="map-board" aria-label="외곽 타일 맵 테스트">
      <div class="map-shade" aria-hidden="true"></div>
      <header class="map-toolbar">
        <a href="index.html" aria-label="시작 화면으로 돌아가기">⌂</a>
        <div class="map-tabs" aria-label="맵 선택">
          <button class="is-active" type="button" data-map="default">기본</button>
          <button type="button" data-map="winter">겨울</button>
          <button type="button" data-map="hell">지옥</button>
        </div>
        <button id="regenerateButton" class="regenerate" type="button">타일 재생성</button>
        <a href="v2-tile-practice.html" aria-label="집 타일 기능 테스트 열기">집 테스트</a>
      </header>
      <div id="tileRing" class="tile-ring" aria-label="생성된 외곽 타일 24칸"></div>
      <div id="heroToken" class="hero-token" aria-label="주인공 말, 현재 1번 타일">
        <img src="art/v2-style/map-test/hero/necromancer-hero.png" alt="주인공 네크로맨서">
      </div>
      <section class="dice-controller" aria-label="주사위 이동 테스트">
        <button id="mapDiceButton" type="button" aria-label="주사위를 굴려 말을 이동하기">
          <img id="mapDiceImage" src="art/v2-style/dice-test/frames/roll-01.png" alt="굴리기 전 주사위">
        </button>
        <div><span id="moveState">현재 1번 타일</span><strong id="diceResult">주사위 굴리기</strong></div>
      </section>
      <div class="tile-info" aria-live="polite">
        <span id="mapName">기본 지역</span>
        <strong id="tileName">타일을 선택하세요</strong>
      </div>
      <button id="mapBookButton" class="map-book-button" type="button" aria-label="책 열기" aria-pressed="false">
        <img id="mapBookImage" src="art/v2-style/ui/map-book-closed.png" alt="">
      </button>
      <div id="mapBookRoster" class="map-book-roster map-deck-roster" aria-label="보유 마물 카드 10장" hidden></div>
      <section id="mapUnitInfoOverlay" class="map-unit-info-overlay" hidden>
        <button id="mapUnitInfoBackdrop" class="map-unit-info-backdrop" type="button" aria-label="마물 정보 닫기"></button>
        <article class="map-unit-info-panel" role="dialog" aria-modal="true" aria-labelledby="mapUnitInfoName">
          <img class="map-unit-info-frame" src="art/v2-style/ui/unit-info-window-no-portrait.png?v=3" alt="" aria-hidden="true">
          <header>
            <h2 id="mapUnitInfoName">마물 정보</h2>
          </header>
          <button id="mapUnitInfoClose" type="button" aria-label="마물 정보 닫기">×</button>
          <div class="map-unit-info-summary">
            <div class="map-unit-info-portrait"><img id="mapUnitInfoPortrait" alt=""></div>
            <div class="map-unit-info-fields">
              <section class="map-unit-info-basic" aria-label="등급과 군단">
                <dl class="map-unit-info-values">
                  <div><dt>등급</dt><dd id="mapUnitInfoGrade">-</dd></div>
                  <div><dt>군단</dt><dd id="mapUnitInfoLegion">-</dd></div>
                </dl>
              </section>
              <section class="map-unit-info-stats" aria-label="능력치">
                <dl class="map-unit-info-values">
                  <div><dt>체력</dt><dd id="mapUnitInfoHp">-</dd></div>
                  <div><dt>공격력</dt><dd id="mapUnitInfoAttack">-</dd></div>
                  <div><dt>속도</dt><dd id="mapUnitInfoSpeed">-</dd></div>
                </dl>
              </section>
            </div>
          </div>
          <section class="map-unit-info-detail" aria-label="패시브와 낙인">
            <div id="mapUnitInfoBrands" class="map-unit-info-brands"></div>
          </section>
        </article>
      </section>
      <section id="tileEventOverlay" class="tile-event-overlay" role="dialog" aria-modal="true" aria-label="타일 장면" hidden>
        <div class="tile-event-scene">
          <img id="tileEventImage" alt="">
          <div id="treasureChestSprite" class="treasure-chest-sprite" role="img" aria-label="보물상자가 열리는 모습" hidden></div>
          <button id="tileEventEnter" class="tile-event-enter" type="button" hidden>들어가기</button>
          <button id="tileEventInheritance" class="tile-event-enter" type="button" hidden>낙인 계승</button>
          <button id="tileEventClose" class="tile-event-exit" type="button">나가기</button>
        </div>
      </section>
      <section id="homeInheritanceOverlay" class="home-inheritance-overlay" role="dialog" aria-modal="true" aria-label="낙인 계승" hidden>
        <button class="home-inheritance-backdrop" type="button" aria-label="낙인 계승 창 닫기"></button>
        <div class="home-inheritance-layout">
          <div class="home-inheritance-panel home-inheritance-material" role="group" aria-label="재료 마물">
            <strong class="home-inheritance-panel-title">재료</strong>
            <img id="homeInheritanceMaterialCard" class="home-inheritance-panel-card" alt="" hidden>
            <span id="homeInheritanceMaterialHint" class="home-inheritance-panel-hint">아래에서 마물을 선택</span>
          </div>
          <section class="home-inheritance-brand-box" aria-label="낙인 계승 효과 정보" aria-live="polite">
            <h3>효과 정보</h3>
            <p id="homeInheritanceBrandHint">재료 카드를 선택하세요</p>
            <ul id="homeInheritanceBrandList" hidden></ul>
            <div id="homeInheritanceParts" class="home-inheritance-parts" role="group" aria-label="계승할 효과 선택" hidden>
              <button type="button" data-inherit-part="bless">축복</button>
              <button type="button" data-inherit-part="curse">저주</button>
              <button type="button" data-inherit-part="both">둘 다</button>
            </div>
          </section>
          <div class="home-inheritance-panel home-inheritance-result" role="group" aria-label="계승 결과">
            <strong class="home-inheritance-panel-title">결과</strong>
            <img id="homeInheritanceResultCard" class="home-inheritance-panel-card" alt="" hidden>
            <span id="homeInheritanceResultHint" class="home-inheritance-panel-hint">계승 결과 대기</span>
          </div>
        </div>
        <button id="homeInheritanceConfirm" class="home-inheritance-confirm" type="button" disabled>계승</button>
        <button id="homeInheritanceClose" class="home-inheritance-close" type="button">닫기</button>
        <div id="homeInheritanceCards" class="home-inheritance-cards map-deck-roster" aria-label="보유 마물 카드 10장"></div>
      </section>
      <section id="mapDeckOverlay" class="map-deck-overlay" role="dialog" aria-modal="true" aria-label="전장 덱 선택" hidden>
        <div class="map-deck-window">
          <img class="map-deck-board" src="art/v2-style/ui/battle-deck-selection-board.png" alt="전장 덱 선택 보드, 카드 자리 4칸">
          <div id="mapSelectedLineup" class="map-selected-lineup" aria-label="선택한 마물 카드 4장"></div>
        </div>
        <div id="mapDeckRoster" class="map-deck-roster" aria-label="선택 가능한 마물 카드 10장"></div>
        <p id="mapDeckStatus" aria-live="polite">마물 카드 0 / 4</p>
        <button id="mapDeckConfirm" class="map-deck-confirm" type="button" disabled>확인</button>
      </section>
    </section>
  </main>
  <aside class="portrait-warning" aria-hidden="true"></aside>
  <script src="v2-landscape.js?v=1"></script>
  <script src="v2-music.js?v=1"></script>
  <script src="v2-sfx.js?v=3"></script>
  <script src="v2-design-data.js?v=1"></script>
  <script src="v2-rules.js?v=5"></script>
  <script src="v2-home-inheritance.js?v=4"></script>
  <script src="v2-map-practice.js?v=24"></script>
</body>
</html>

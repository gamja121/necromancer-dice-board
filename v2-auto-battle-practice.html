<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0807">
  <title>4대4 속도 자동전투 테스트</title>
  <link rel="stylesheet" href="v2-auto-battle-practice.css?v=45">
</head>
<body>
  <main class="auto-battle-lab">
    <section id="battlefield" class="battlefield" aria-label="4대4 속도 자동전투">
      <div class="battle-shade" aria-hidden="true"></div>
      <header class="battle-toolbar">
        <a href="v2-map-practice.html" aria-label="맵 테스트로 돌아가기">맵</a>
        <div class="battle-state"><strong id="roundState">4+1 VS 4+1</strong><span id="battleMessage">전투 시작을 눌러주세요</span></div>
        <div class="battle-controls">
          <button id="pauseButton" type="button" disabled>일시정지</button>
          <button id="speedButton" type="button" disabled>속도 ×1</button>
          <button id="restartButton" type="button">편성 변경</button>
        </div>
      </header>

      <aside class="team-legion-panel ally-legion-panel" aria-label="아군 활성 군단">
        <span>아군 활성 군단</span>
        <div id="allyActiveLegions" class="active-legion-slots"></div>
      </aside>
      <aside class="team-legion-panel enemy-legion-panel" aria-label="적군 활성 군단">
        <span>적군 활성 군단</span>
        <div id="enemyActiveLegions" class="active-legion-slots"></div>
      </aside>

      <section id="allyTeam" class="team ally-team" aria-label="아군 일반 유닛 4명과 소환물 자리 1칸"></section>
      <section id="enemyTeam" class="team enemy-team" aria-label="적군 일반 유닛 4명과 소환물 자리 1칸"></section>

      <section id="turnDice" class="turn-dice" aria-live="polite" hidden>
        <button id="turnDiceButton" type="button" aria-label="다음 턴 주사위 굴리기">
          <img id="turnDiceImage" src="art/v2-style/dice-test/frames/roll-01.png" alt="굴리기 전 주사위">
        </button>
      </section>

      <section id="unitInfoOverlay" class="unit-info-overlay" hidden>
        <button id="unitInfoBackdrop" class="unit-info-backdrop" type="button" aria-label="유닛 정보 닫기"></button>
        <article class="unit-info-panel" role="dialog" aria-modal="true" aria-labelledby="unitInfoName">
          <img class="unit-info-frame-art" src="art/v2-style/ui/unit-info-window.png" alt="" aria-hidden="true">
          <header>
            <span>UNIT STATUS</span>
            <h2 id="unitInfoName">유닛 정보</h2>
            <button id="unitInfoClose" type="button" aria-label="유닛 정보 닫기">×</button>
          </header>
          <div class="unit-info-summary">
            <div class="unit-info-portrait">
              <svg id="unitInfoPortrait" viewBox="0 0 192 192" preserveAspectRatio="xMidYMid meet" role="img" aria-label="선택한 유닛">
                <image id="unitInfoImage" width="192" height="192" />
              </svg>
            </div>
            <div class="unit-info-fields">
              <section class="unit-info-basic" aria-labelledby="unitInfoBasicTitle">
                <h3 id="unitInfoBasicTitle">기본 정보</h3>
                <dl class="unit-info-values">
                  <div><dt>등급</dt><dd id="unitInfoGrade">-</dd></div>
                  <div><dt>군단</dt><dd id="unitInfoLegion">-</dd></div>
                </dl>
              </section>
              <section class="unit-info-stats" aria-labelledby="unitInfoStatsTitle">
                <h3 id="unitInfoStatsTitle">스탯</h3>
                <dl class="unit-info-values">
                  <div><dt>체력</dt><dd id="unitInfoHp">0 / 0</dd></div>
                  <div><dt>공격력</dt><dd id="unitInfoAttack">0</dd></div>
                  <div><dt>속도</dt><dd id="unitInfoSpeed">0</dd></div>
                </dl>
              </section>
            </div>
          </div>
          <section class="unit-info-detail" aria-labelledby="unitInfoBrandsTitle">
            <h3 id="unitInfoBrandsTitle">낙인 정보</h3>
            <div id="unitInfoBrands" class="unit-info-brands">
              <p class="unit-info-empty">유닛을 선택하면 예시 낙인이 표시됩니다.</p>
            </div>
          </section>
        </article>
        <aside class="legion-info-panel" aria-labelledby="legionInfoTitle">
          <img class="legion-info-frame-art" src="art/v2-style/ui/legion-info-window-hd.png" alt="" aria-hidden="true">
          <div class="legion-info-inner">
            <h2 id="legionInfoTitle">군단 효과</h2>
            <div id="legionInfoContent" class="legion-info-content">
              <p>유닛을 선택하면 적용 중인 군단 효과가 표시됩니다.</p>
            </div>
          </div>
        </aside>
      </section>

      <section id="startOverlay" class="battle-overlay">
        <div class="overlay-panel lineup-panel">
          <span>LANDSCAPE BATTLE TEST</span>
          <h1>아군과 적군을 1~4명 선택하세요</h1>
          <div class="lineup-side-tabs" role="group" aria-label="편집할 진영">
            <button id="allyLineupTab" type="button" class="is-active" aria-pressed="true">아군 편성</button>
            <button id="enemyLineupTab" type="button" aria-pressed="false">적군 편성</button>
          </div>
          <div class="lineup-summaries">
            <section id="allyLineupSummary" class="lineup-side-summary is-active"><strong>아군</strong><div id="selectedLineup" class="selected-lineup" aria-label="선택한 아군"></div></section>
            <section id="enemyLineupSummary" class="lineup-side-summary"><strong>적군</strong><div id="selectedEnemyLineup" class="selected-lineup" aria-label="선택한 적군"></div></section>
          </div>
          <p id="lineupStatus" aria-live="polite">아군 4 / 4 · 적군 4 / 4</p>
          <button id="startButton" type="button">이 편성으로 전투 시작</button>
          <div id="unitRoster" class="unit-roster" aria-label="선택 가능한 유닛"></div>
        </div>
      </section>

      <section id="capturePanel" class="battlefield-capture" aria-live="polite" hidden>
        <img class="legion-info-frame-art" src="art/v2-style/ui/legion-info-window-hd.png" alt="" aria-hidden="true">
        <div class="legion-info-inner">
          <h2>영혼 수확</h2>
          <div class="legion-info-content capture-info-content">
            <p id="captureStatus">전장의 죽은 적 또는 적 카드를 선택하세요.</p>
          </div>
        </div>
      </section>

      <section id="resultOverlay" class="battle-overlay" hidden>
        <div class="overlay-panel">
          <span>BATTLE COMPLETE</span>
          <h2 id="resultTitle">승리</h2>
          <p id="resultBody"></p>
          <button id="resultRestartButton" type="button">다시 전투</button>
        </div>
      </section>
    </section>
  </main>
  <script src="v2-landscape.js?v=1"></script>
  <script src="unit-data.js?v=50"></script>
  <script src="v2-mantis-frames.js?v=5"></script>
  <script src="v2-seed-frames.js?v=1"></script>
  <script src="v2-summon-rules.js?v=1"></script>
  <script src="v2-scorpion-frames.js?v=1"></script>
  <script src="v2-hound-frames.js?v=1"></script>
  <script src="v2-hydra-frames.js?v=1"></script>
  <script src="v2-harpy-frames.js?v=1"></script>
  <script src="v2-blood-frames.js?v=1"></script>
  <script src="v2-princess-frames.js?v=1"></script>
  <script src="v2-goblin-frames.js?v=1"></script>
  <script src="v2-battle-brands.js?v=3"></script>
  <script src="v2-legions.js?v=3"></script>
  <script src="v2-summon-effect.js?v=3"></script>
  <script src="v2-hit-effects.js?v=9"></script>
  <script src="v2-combat-effects.js?v=8"></script>
  <script src="v2-damage-digits.js?v=4"></script>
  <script src="v2-unit-size.js?v=4"></script>
  <script src="v2-unit-cards.js?v=12"></script>
  <script src="v2-auto-battle-practice.js?v=54"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020307">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Necromancer and Dice</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260927-v2">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <link rel="stylesheet" href="launch.css?v=20260930-title-menu-4">
</head>
<body class="is-locked">
  <video id="titleVideo" class="title-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/title/title-loop.mp4" type="video/mp4">
  </video>
  <audio id="titleBgm" src="assets/title/title-theme.mp3" loop preload="auto"></audio>
  <div class="shade" aria-hidden="true"></div>

  <div id="rotateOverlay" class="rotate-overlay" aria-hidden="true">
    <div class="phone-icon">↻</div>
    <strong>가로로 돌려주세요</strong>
    <small>타이틀은 가로 화면으로 제작되었습니다.</small>
  </div>

  <button id="titleUnlock" class="title-unlock" type="button">
    <span>NECROMANCER AND DICE</span>
    <strong>TOUCH TO START</strong>
    <small>영상 사운드와 타이틀 BGM이 시작됩니다</small>
  </button>

  <main class="title-shell">
    <section class="title-panel" aria-label="Necromancer and Dice title">
      <img class="title-logo" src="assets/title/title-logo.webp" alt="NECROMANCER AND DICE">

      <nav class="title-menu" aria-label="Main menu">
        <button id="newGameButton" class="menu-image" type="button" aria-label="New Game">
          <img src="assets/title/new-game.webp" alt="NEW GAME">
        </button>
        <a id="continueButton" class="menu-image" href="v2-map-practice.html" aria-label="Continue">
          <img src="assets/title/continue.webp" alt="CONTINUE">
        </a>
        <button id="optionsButton" class="menu-image" type="button" aria-label="Options">
          <img src="assets/title/options.webp" alt="OPTIONS">
        </button>
        <button id="exitButton" class="menu-image menu-exit" type="button" aria-label="Exit">
          <img src="assets/title/exit.webp" alt="EXIT">
        </button>
      </nav>
    </section>

    <aside id="optionsPanel" class="options-panel" hidden>
      <div class="options-head">
        <strong>OPTIONS</strong>
        <button id="closeOptionsButton" type="button" aria-label="Close">×</button>
      </div>
      <div class="option-row">
        <span>영상 사운드 + BGM</span>
        <button id="titleSoundToggle" type="button" aria-pressed="true">ON</button>
      </div>
      <button id="installAppButton" type="button" hidden>앱으로 설치</button>
    </aside>

    <p id="titleToast" class="title-toast" role="status" aria-live="polite"></p>
  </main>

  <script src="launch.js?v=20260930-title-menu-3"></script>
</body>
</html>
